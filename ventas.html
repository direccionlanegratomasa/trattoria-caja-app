:root{
  --amarillo:#FFFFFF;        /* amarillo corporativo */
  --amarillo-claro:#EFEFEF;
  --amarillo-borde:#BDBDBD;
  --tinta:#111111;           /* negro del logotipo */
  --papel:#F4F4F4;
  --blanco:#FFFFFF;
  --linea:#D6D6D6;
  --pista:#E6E6E6;
  --suave:#5F5F5F;
  --ambar:#C98F00;
  --ladrillo:#B23A2E;
  --oliva:#6E7A3A;
  --piedra:#A39D87;
  --sube:#17623F; --sube-bg:#D9F2E5;
  --baja:#8E2A21; --baja-bg:#F8DCD8;
  --sans:'Space Grotesk', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
}
*{ box-sizing:border-box; }
html{ -webkit-text-size-adjust:100%; }
body{ margin:0; background:var(--papel); color:var(--tinta); font-family:var(--sans); font-size:16px; line-height:1.45; font-variant-numeric:tabular-nums; }
button, select, input{ font-family:inherit; font-size:inherit; color:inherit; }
button{ cursor:pointer; }
:focus-visible{ outline:3px solid var(--tinta); outline-offset:2px; }
.oscuro :focus-visible, .tabs :focus-visible{ outline-color:var(--amarillo); }
.oculto{ display:none !important; }
.solo-lector{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }

/* ---------- Cabecera de marca ---------- */
.cab{ background:var(--tinta); color:#FFFFFF; border-bottom:4px solid #FFFFFF; }
.cab-in{ max-width:1100px; margin:0 auto; padding:14px 18px; display:flex; align-items:center; justify-content:space-between; gap:10px 24px; flex-wrap:wrap; }
.marca{ display:flex; align-items:center; gap:12px; }
.marca .ico{ height:62px; width:auto; display:block; }
.marca .pal{ height:54px; width:auto; display:block; }
.rotulo{ display:block; font-weight:700; font-size:30px; line-height:1; letter-spacing:-.02em; }
.rotulo small{ display:block; margin-top:4px; font-size:13px; font-weight:500; letter-spacing:.14em; text-transform:uppercase; color:#C8C8C8; }
@media (max-width:620px){ .rotulo{ font-size:25px; } }
.cab-txt{ text-align:right; line-height:1.2; }
.cab-txt b{ display:block; font-size:20px; font-weight:700; letter-spacing:-.01em; }
.cab-txt small{ display:block; margin-top:3px; font-size:13px; color:#C8C8C8; }
@media (max-width:620px){ .marca .ico{ height:50px; } .marca .pal{ height:44px; } .cab-in{ padding:12px 16px; } .cab-txt{ text-align:left; width:100%; } .cab-txt b{ font-size:18px; } .cab-txt small{ margin-top:2px; } }

/* ---------- Pestañas ---------- */
.tabs{ background:var(--tinta); position:sticky; top:0; z-index:30; }
.tabs-in{ max-width:1100px; margin:0 auto; padding:0 6px; display:flex; gap:0; overflow-x:auto; scrollbar-width:none; }
.tabs-in::-webkit-scrollbar{ display:none; }
.tab{ flex:1 1 auto; background:none; border:0; color:#E6E6E6; padding:14px 8px 12px; font-weight:500; font-size:15px; border-bottom:4px solid transparent; white-space:nowrap; text-align:center; }
.tab[aria-selected="true"]{ color:var(--amarillo); border-bottom-color:var(--amarillo); font-weight:700; }
.tab:hover{ color:#fff; }

/* ---------- Página ---------- */
.pag{ max-width:1100px; margin:0 auto; padding:18px 18px 56px; }
.vacio{ background:var(--blanco); border:2px dashed var(--linea); border-radius:10px; padding:28px 20px; text-align:center; color:var(--suave); }
.vacio b{ display:block; color:var(--tinta); font-size:18px; margin-bottom:4px; }
.aviso{ border-radius:10px; padding:11px 14px; font-size:14.5px; border:1.5px solid; margin:12px 0; }
.aviso.err{ background:var(--baja-bg); border-color:#E0A39B; color:var(--baja); }
.aviso.warn{ background:var(--amarillo-claro); border-color:var(--amarillo-borde); color:#111111; }
.aviso.ok{ background:var(--sube-bg); border-color:#9DC7B4; color:var(--sube); }
.aviso.info{ background:#F1F0EA; border-color:var(--linea); color:var(--tinta); }

/* ---------- Controles ---------- */
.seg{ display:inline-flex; border:2px solid var(--tinta); border-radius:10px; overflow:hidden; background:var(--blanco); max-width:100%; }
.seg button{ background:none; border:0; padding:9px 14px; font-weight:500; white-space:nowrap; border-right:2px solid var(--tinta); min-height:40px; }
.seg button:last-child{ border-right:0; }
.seg button[aria-pressed="true"]{ background:var(--tinta); color:var(--amarillo); font-weight:700; }
.seg button:hover:not([aria-pressed="true"]){ background:var(--amarillo-claro); }
@media (max-width:420px){ .seg button{ padding:9px 10px; } }
.seg.scroll{ overflow-x:auto; scrollbar-width:none; }
.seg.scroll::-webkit-scrollbar{ display:none; }
.btn{ font-weight:700; border-radius:10px; padding:12px 20px; border:2px solid var(--tinta); background:var(--tinta); color:var(--amarillo); min-height:44px; }
.btn:hover:not(:disabled){ background:#000; box-shadow:0 0 0 3px rgba(255,212,0,.6); }
.btn:disabled{ opacity:.4; cursor:not-allowed; }
.btn.claro{ background:var(--blanco); color:var(--tinta); }
.btn.claro:hover:not(:disabled){ background:var(--amarillo-claro); }
.btn.peligro{ background:var(--blanco); color:var(--baja); border-color:var(--baja); }
.sel, .campo{ width:100%; border:2px solid var(--tinta); border-radius:10px; background:var(--blanco); padding:9px 12px; min-height:44px; font-weight:500; }
.sel{ appearance:none; -webkit-appearance:none; padding-right:36px;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%231C1A12' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'></polyline></svg>");
  background-repeat:no-repeat; background-position:right 12px center; }
.flecha{ width:44px; min-width:44px; height:44px; border:2px solid var(--tinta); border-radius:10px; background:var(--blanco); display:inline-flex; align-items:center; justify-content:center; padding:0; }
.flecha:hover:not(:disabled){ background:var(--amarillo-claro); }
.flecha:disabled{ opacity:.3; cursor:not-allowed; }
.flecha svg{ width:16px; height:16px; stroke:var(--tinta); stroke-width:3; fill:none; stroke-linecap:round; stroke-linejoin:round; }

/* ---------- Variación (sube / baja) ---------- */
.delta{ display:inline-flex; align-items:center; gap:5px; border-radius:999px; padding:3px 10px; font-weight:700; font-size:14px; line-height:1.3; white-space:nowrap; }
.delta svg{ width:10px; height:10px; fill:currentColor; }
.delta.sube{ background:var(--sube-bg); color:var(--sube); }
.delta.baja{ background:var(--baja-bg); color:var(--baja); }
.delta.igual{ background:#ECE7D8; color:var(--tinta); }

/* ---------- Bloques (comunes) ---------- */
.bloque{ border-top:4px solid var(--tinta); padding-top:14px; min-width:0; }
.bloque > h2, .bloque-cab h2{ margin:0 0 14px; font-size:22px; font-weight:700; letter-spacing:-.015em; }
.bloque-cab{ display:flex; align-items:center; justify-content:space-between; gap:10px 16px; flex-wrap:wrap; margin-bottom:14px; }
.bloque-cab h2{ margin:0; }
.sub-txt{ color:var(--suave); font-size:14px; margin:-6px 0 14px; }
.pag > .bloque{ margin-bottom:34px; }
.notas{ padding-left:20px; margin:0; } .notas li{ margin-bottom:8px; }
.contador{ color:var(--suave); font-size:14px; margin:0 0 8px; }

/* ---------- Acceso con código ---------- */
.acceso{ max-width:460px; }
.acceso label{ font-weight:500; font-size:14px; display:block; margin-bottom:4px; }
.enlace{ background:none; border:0; padding:0; text-decoration:underline; font-weight:700; color:inherit; cursor:pointer; font-size:inherit; }

.rejilla{ display:grid; gap:34px 40px; }
@media (min-width:960px){ .rejilla.dos{ grid-template-columns:1fr 1fr; align-items:start; } }
/* ---------- Selector de periodo ---------- */
.periodo{ display:flex; flex-direction:column; gap:12px; margin-bottom:26px; }
.periodo .fila{ display:flex; gap:8px; align-items:center; }
.periodo .fila.centro{ justify-content:flex-start; }
.periodo .rangos{ display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:10px; }
.periodo .rangos > div{ min-width:0; }
.periodo input[type=date]{ min-width:0; }
.rango-caja{ display:flex; flex-direction:column; gap:10px; width:100%; }
.btn.peq{ padding:7px 14px; min-height:38px; font-size:14px; }
.periodo label{ font-size:13px; color:var(--suave); display:block; margin-bottom:4px; font-weight:500; }
@media (min-width:700px){ .periodo{ flex-direction:row; align-items:center; justify-content:space-between; } .periodo .fila.nav{ flex:0 1 480px; } .rango-caja{ flex:0 1 480px; width:auto; } }

/* ---------- Ticket de ventas ---------- */
.ticket{ position:relative; background:var(--tinta); color:#fff; padding:22px 20px 30px; margin-bottom:46px; border-radius:6px 6px 0 0; }
.ticket::after{ content:""; position:absolute; left:0; right:0; bottom:-14px; height:14px;
  background:linear-gradient(135deg, var(--tinta) 7px, transparent 0) 0 0/16px 14px repeat-x, linear-gradient(225deg, var(--tinta) 7px, transparent 0) 0 0/16px 14px repeat-x; }
.ticket .et{ font-size:16px; font-weight:500; color:#EDEDED; margin:0; }
.ticket .sub{ font-size:14px; color:#BDB69F; margin:2px 0 0; }
.ticket .cifra{ font-size:clamp(30px, min(13.5vw, calc((100vw - 76px) / (var(--n, 10) * .6))), 92px); line-height:1; font-weight:700; letter-spacing:-.035em; color:var(--amarillo); margin:14px 0 12px; white-space:nowrap; }
.ticket .var{ display:flex; align-items:center; flex-wrap:wrap; gap:6px 10px; font-size:14px; color:#E6E6E6; }
.ticket .var:empty{ display:none; }
.ticket .cifra{ margin-bottom:14px; }
.ticket .datos{ display:grid; grid-template-columns:1fr 1fr; gap:16px 14px; margin:22px 0 0; padding:18px 0 0; border-top:2px dashed #6A6A6A; }
.ticket .dato{ min-width:0; }
.ticket .dato small{ display:block; font-size:14px; color:#CFCFCF; }
.ticket .dato b{ display:block; font-size:26px; font-weight:700; line-height:1.15; color:#fff; }
.ticket .dato .d{ font-size:13px; font-weight:700; margin-top:2px; }
.ticket .dato .d.sube{ color:#7EE0AB; } .ticket .dato .d.baja{ color:#FFA79E; } .ticket .dato .d.igual{ color:#CFCFCF; }
.ticket .nota{ margin:16px 0 0; font-size:14px; color:#D0D0D0; }
@media (min-width:760px){ .ticket{ padding:28px 34px 36px; } .ticket .dato b{ font-size:28px; } }
@media (min-width:980px){
  .ticket{ display:grid; grid-template-columns:minmax(0,1fr) 400px; grid-template-areas:'et datos' 'sub datos' 'cifra datos' 'var datos' 'nota datos'; column-gap:40px; align-content:start; }
  .ticket .et{ grid-area:et; } .ticket .sub{ grid-area:sub; } .ticket .cifra{ grid-area:cifra; font-size:clamp(40px, calc((min(100vw, 1100px) - 544px) / (var(--n, 10) * .6)), 96px); margin-top:18px; } .ticket .var{ grid-area:var; } .ticket .nota{ grid-area:nota; }

<body>
<div id="app"></div>
<noscript>Esta página necesita JavaScript para mostrar las ventas.</noscript>
<script>
/* ============================================================
   Núcleo compartido · Ventas Trattoria Sant Arcangelo
   (acceso a datos, modelo, periodos, agregación, comparativas)
   Sin dependencias de la interfaz: se puede probar en Node.
   ============================================================ */
var TOM = (function(){
'use strict';

var CFG = {
  categoriasBase: ['Bebidas', 'Antipasti y ensaladas', 'Pasta y risotto', 'Pizzas', 'Carnes y pescados', 'Postres', 'Café e infusiones', 'Complementos'],
  sinClasificar: 'Sin clasificar',
  excluido: 'Cupones (no cuentan)',             // productos que el análisis ignora por completo (cupones)
  musicos: 'Invitaciones y personal',          // no suman en las ventas; se muestran aparte
  entradas: 'Entradas (no se usa en Trattoria)',           // entradas: se detallan por proveedor
  sinProveedor: 'Sin proveedor'
};

/* ---------- Texto y números ---------- */
var MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
var MESES_C = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
var DIAS_C = ['lun', 'mar', 'mié', 'jue', 'vie', 'sáb', 'dom'];
var DIAS_L = ['lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado', 'domingo'];

function pad(n){ return (n < 10 ? '0' : '') + n; }
function fmtNum(x, dec){
  dec = dec || 0;
  var neg = x < 0 && Math.round(Math.abs(x) * Math.pow(10, dec)) > 0;
  var s = Math.abs(x).toFixed(dec), p = s.split('.');
  var ent = p[0].replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  return (neg ? '\u2212' : '') + ent + (p[1] ? ',' + p[1] : '');
}
function fmtEur(cents){ return fmtNum(cents / 100, 2) + '\u00a0€'; }
function fmtEurEnt(cents){ return fmtNum(Math.round(cents / 100), 0) + '\u00a0€'; }
function fmtPct(p, dec){ return fmtNum(p, dec == null ? 1 : dec) + '\u00a0%'; }
function pctVar(actual, previo){ return previo > 0 ? (actual - previo) / previo * 100 : null; }

/* Clave de producto: sin acentos, mayúsculas, espacios simples. "Cremoso maracuyá" = "CREMOSO MARACUYA". */
function claveProducto(n){
  return String(n).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toUpperCase().replace(/\s+/g, ' ').trim();
}
function limpiarNombre(n){ return String(n).replace(/\s+/g, ' ').trim(); }
function nombreCentro(raw){ return titulo(limpiarNombre(String(raw).split('/')[0])); }
function titulo(s){ return String(s).toLowerCase().replace(/(^|\s)(\S)/g, function(_, a, b){ return a + b.toUpperCase(); }); }
function cmpTexto(a, b){ return String(a).localeCompare(String(b), 'es', { sensitivity: 'base' }); }

/* ---------- Fechas (cadenas AAAA-MM-DD; cálculo en UTC, sin husos horarios) ---------- */
function isoNum(iso){ var p = iso.split('-'); return Math.round(Date.UTC(+p[0], +p[1] - 1, +p[2]) / 86400000); }
function numIso(n){ var d = new Date(n * 86400000); return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate()); }
function sumarDias(iso, k){ return numIso(isoNum(iso) + k); }
function diaSemana(iso){ return (((isoNum(iso) + 3) % 7) + 7) % 7; }          // 0 = lunes … 6 = domingo
function lunesDe(iso){ return sumarDias(iso, -diaSemana(iso)); }
function inicioMes(iso){ return iso.slice(0, 7) + '-01'; }
function finMes(iso){ var p = iso.split('-'); return numIso(Math.round(Date.UTC(+p[0], +p[1], 0) / 86400000)); }
function mesAnterior(iso){ var p = iso.split('-'), y = +p[0], m = +p[1] - 1; if (m < 1){ m = 12; y--; } return y + '-' + pad(m) + '-01'; }
function esIso(s){ return typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s) && numIso(isoNum(s)) === s; }
function rango(desde, hasta){ var out = [], a = isoNum(desde), b = isoNum(hasta); for (var i = a; i <= b; i++) out.push(numIso(i)); return out; }

function fmtFecha(iso){ var p = iso.split('-'); return pad(+p[2]) + '/' + pad(+p[1]) + '/' + p[0]; }
function fmtFechaLarga(iso){ var p = iso.split('-'); return DIAS_C[diaSemana(iso)] + ' ' + (+p[2]) + ' ' + MESES_C[+p[1] - 1] + ' ' + p[0]; }
function fmtDiaMes(iso){ var p = iso.split('-'); return (+p[2]) + ' ' + MESES_C[+p[1] - 1]; }
function nombreMes(iso){ var p = iso.split('-'); var m = MESES[+p[1] - 1]; return m.charAt(0).toUpperCase() + m.slice(1) + ' ' + p[0]; }
function etiquetaSemana(lunes){
  var dom = sumarDias(lunes, 6), a = lunes.split('-'), b = dom.split('-');
  return 'Semana del ' + (+a[2]) + ' ' + MESES_C[+a[1] - 1] + (a[0] !== b[0] ? ' ' + a[0] : '') + ' al ' + (+b[2]) + ' ' + MESES_C[+b[1] - 1] + ' ' + b[0];
}

/* ---------- Modelo ---------- */
function normalizarClasif(raw){
  var c = { orden: [], productos: {} };
  if (raw && typeof raw === 'object'){
    if (Array.isArray(raw.orden)) c.orden = raw.orden.slice();
    if (raw.productos && typeof raw.productos === 'object') c.productos = raw.productos;
  }
  if (!c.orden.length) c.orden = CFG.categoriasBase.slice();
  Object.keys(c.productos).forEach(function(k){ var cat = c.productos[k].c; if (cat && c.orden.indexOf(cat) < 0) c.orden.push(cat); });
  return c;
}
function prepararDia(fecha, d, clase){
  var nC = d.centros.length, filas = [], tot = { u: 0, c: 0 }, ex = { u: 0, c: 0 }, mus = { u: 0, c: 0 }, porCentro = d.centros.map(function(){ return { u: 0, c: 0 }; });
  (d.filas || []).forEach(function(r){
    var u = [], c = [], k = claveProducto(r[0]), cl = clase(k);
    for (var i = 0; i < nC; i++){
      var uu = +r[1 + 2 * i] || 0, cc = Math.round((+r[2 + 2 * i] || 0) * 100);
      u.push(uu); c.push(cc);
      if (cl === 'ex'){ ex.u += uu; ex.c += cc; }
      else if (cl === 'mus'){ mus.u += uu; mus.c += cc; }
      else { porCentro[i].u += uu; porCentro[i].c += cc; tot.u += uu; tot.c += cc; }
    }
    filas.push({ k: k, n: limpiarNombre(r[0]), u: u, c: c, ex: cl !== null, mus: cl === 'mus' });
  });
  return { fecha: fecha, centros: d.centros.slice(), comensales: Array.isArray(d.comensales) && d.comensales.length === nC ? d.comensales.map(function(x){ return +x || 0; }) : null, tickets: Array.isArray(d.tickets) && d.tickets.length === nC ? d.tickets.map(function(x){ return +x || 0; }) : null, filas: filas, tot: tot, excl: ex, mus: mus, porCentro: porCentro, archivo: d.archivo || '', cargado: d.cargado || '' };
}
function crearModelo(shards, clasifRaw){
  var clasif = normalizarClasif(clasifRaw), dias = {}, centros = [];
  var clase = function(k){ var p = clasif.productos[k]; return p && p.c === CFG.excluido ? 'ex' : (p && p.c === CFG.musicos ? 'mus' : null); };
  (shards || []).forEach(function(sh){
    var dd = (sh && sh.dias) || (sh && sh.datos && sh.datos.dias) || {};
    Object.keys(dd).forEach(function(f){ if (esIso(f) && dd[f] && Array.isArray(dd[f].centros)) dias[f] = prepararDia(f, dd[f], clase); });
  });
  var fechas = Object.keys(dias).sort();
  fechas.forEach(function(f){ dias[f].centros.forEach(function(c){ if (centros.indexOf(c) < 0) centros.push(c); }); });
  var cats = clasif.orden.filter(function(x){ return x !== CFG.excluido && x !== CFG.musicos; }); if (cats.indexOf(CFG.sinClasificar) < 0) cats.push(CFG.sinClasificar);
  var exU = 0, exC = 0, muU = 0, muC = 0; fechas.forEach(function(f){ exU += dias[f].excl.u; exC += dias[f].excl.c; muU += dias[f].mus.u; muC += dias[f].mus.c; });
  return { dias: dias, fechas: fechas, centros: centros, clasif: clasif, categorias: cats, excluidos: { u: exU, c: exC }, musicos: { u: muU, c: muC } };
}
function catDe(m, k){ var p = m.clasif.productos[k]; return p && p.c ? p.c : CFG.sinClasificar; }
function subDe(m, k){ var p = m.clasif.productos[k]; return p && p.s ? p.s : null; }

/* ---------- Agregación ---------- */
function agregar(m, fechas){
  var a = { fechas: fechas.filter(function(f){ return m.dias[f]; }), u: 0, c: 0, centros: {}, cats: {}, prods: {}, musicos: { u: 0, c: 0, prods: {} } };
  m.centros.forEach(function(c){ a.centros[c] = { u: 0, c: 0 }; });
  m.categorias.forEach(function(c){ a.cats[c] = { u: 0, c: 0 }; });
  a.fechas.forEach(function(f){
    var d = m.dias[f];
    d.filas.forEach(function(r){
      if (r.ex){
        if (r.mus){
          var mp = a.musicos.prods[r.k] || (a.musicos.prods[r.k] = { k: r.k, n: (m.clasif.productos[r.k] && m.clasif.productos[r.k].n) || r.n, u: 0, c: 0, centros: {} });
          for (var j = 0; j < d.centros.length; j++){ mp.u += r.u[j]; mp.c += r.c[j]; a.musicos.u += r.u[j]; a.musicos.c += r.c[j]; mp.centros[d.centros[j]] = (mp.centros[d.centros[j]] || 0) + r.u[j]; }
        }
        return;
      }
      var cat = catDe(m, r.k), p = a.prods[r.k];
      if (!p){ var def = m.clasif.productos[r.k]; p = a.prods[r.k] = { k: r.k, n: def && def.n ? def.n : r.n, cat: cat, sub: subDe(m, r.k), prov: def && def.v ? def.v : null, u: 0, c: 0, centros: {} }; }
      for (var i = 0; i < d.centros.length; i++){
        var cn = d.centros[i];
        p.u += r.u[i]; p.c += r.c[i];
        a.u += r.u[i]; a.c += r.c[i];
        a.centros[cn].u += r.u[i]; a.centros[cn].c += r.c[i];
        if (!a.cats[cat]) a.cats[cat] = { u: 0, c: 0 };
        a.cats[cat].u += r.u[i]; a.cats[cat].c += r.c[i];
        if (!p.centros[cn]) p.centros[cn] = { u: 0, c: 0 };
        p.centros[cn].u += r.u[i]; p.centros[cn].c += r.c[i];
      }
    });
  });
  return a;
}
/* Orden de los rankings: por unidades (o ventas), desempate por la otra magnitud y luego por nombre. */
function ordenar(lista, metrica){
  return lista.slice().sort(function(x, y){
    var p = metrica === 'c' ? (y.c - x.c) || (y.u - x.u) : (y.u - x.u) || (y.c - x.c);
    return p || cmpTexto(x.n, y.n);
  });
}
function ranking(a, categoria, metrica){
  var l = []; Object.keys(a.prods).forEach(function(k){ var p = a.prods[k]; if (!categoria || p.cat === categoria) l.push(p); });
  return ordenar(l, metrica || 'u');
}
function lista(obj, metrica){ return Object.keys(obj).map(function(k){ return { n: k, u: obj[k].u, c: obj[k].c }; }); }

/* Entradas agrupadas por proveedor (y dentro de cada uno, por tipo). Orden: ventas y luego unidades. */
function entradasPorProveedor(a){
  var provs = {}, tot = { u: 0, c: 0 };
  Object.keys(a.prods).forEach(function(k){
    var p = a.prods[k]; if (p.cat !== CFG.entradas) return;
    var nombre = p.prov || CFG.sinProveedor, o = provs[nombre] || (provs[nombre] = { n: nombre, u: 0, c: 0, tipos: {}, prods: [] });
    o.u += p.u; o.c += p.c; tot.u += p.u; tot.c += p.c; o.prods.push(p);
    var t = p.sub || 'Otras', x = o.tipos[t] || (o.tipos[t] = { n: t, u: 0, c: 0 }); x.u += p.u; x.c += p.c;
  });
  var lista = Object.keys(provs).map(function(k){ var o = provs[k]; o.tipos = Object.keys(o.tipos).map(function(t){ return o.tipos[t]; }).sort(function(x, y){ return (y.c - x.c) || (y.u - x.u) || cmpTexto(x.n, y.n); }); o.prods = ordenar(o.prods, 'c'); return o; })
    .sort(function(x, y){ return (y.c - x.c) || (y.u - x.u) || cmpTexto(x.n, y.n); });
  return { total: tot, lista: lista };
}
function listaMusicos(a){ return ordenar(Object.keys(a.musicos.prods).map(function(k){ return a.musicos.prods[k]; }), 'u'); }
function proveedoresConocidos(m){
  var out = []; Object.keys(m.clasif.productos).forEach(function(k){ var p = m.clasif.productos[k]; if (p.c === CFG.entradas && p.v && out.indexOf(p.v) < 0) out.push(p.v); });
  return out.sort(cmpTexto);
}

/* ---------- Periodos ---------- */
function ultimaFecha(m){ return m.fechas.length ? m.fechas[m.fechas.length - 1] : null; }
function primeraFecha(m){ return m.fechas.length ? m.fechas[0] : null; }
function cargados(m, desde, hasta){ return m.fechas.filter(function(f){ return f >= desde && f <= hasta; }); }

/* per = { modo: 'dia'|'semana'|'mes'|'todo'|'rango', ref, desde, hasta } */
function resolverPeriodo(m, per){
  var ult = ultimaFecha(m), prim = primeraFecha(m), desde, hasta, etiqueta, sust, pasado;
  if (!ult) return { modo: per.modo, vacio: true, fechas: [], etiqueta: '', sust: 'periodo' };
  switch (per.modo){
    case 'dia':    desde = hasta = per.ref; etiqueta = fmtFechaLarga(per.ref); sust = 'día'; break;
    case 'semana': desde = lunesDe(per.ref); hasta = sumarDias(desde, 6); etiqueta = etiquetaSemana(desde); sust = 'semana'; break;
    case 'mes':    desde = inicioMes(per.ref); hasta = finMes(per.ref); etiqueta = nombreMes(per.ref); sust = 'mes'; break;
    case 'rango':  desde = per.desde; hasta = per.hasta; if (desde > hasta){ var t = desde; desde = hasta; hasta = t; }
                   etiqueta = fmtFecha(desde) + ' – ' + fmtFecha(hasta); sust = 'periodo'; break;
    default:       desde = prim; hasta = ult; etiqueta = 'Todo el histórico'; sust = 'periodo';
  }
  var hastaEf = hasta > ult ? ult : hasta;          // un periodo en curso se mide "hasta hoy"
  var enCurso = hasta > ult;
  var fechas = cargados(m, desde, hastaEf);
  var nEsp = hastaEf >= desde ? isoNum(hastaEf) - isoNum(desde) + 1 : 0;
  return { modo: per.modo, desde: desde, hasta: hasta, hastaEf: hastaEf, enCurso: enCurso, fechas: fechas, nEsperados: nEsp,
           etiqueta: etiqueta, sust: sust, faltan: Math.max(0, nEsp - fechas.length) };
}
/* Periodo con el que se compara: mismo día de la semana anterior · semana anterior · mes anterior · tramo anterior de igual duración. */
function periodoComparable(m, p){
  if (p.vacio || p.modo === 'todo' || !p.fechas.length) return null;
  var desde, hasta, etiqueta;
  if (p.modo === 'dia'){ desde = hasta = sumarDias(p.desde, -7); etiqueta = 'el ' + fmtFechaLarga(desde); }
  else if (p.modo === 'semana'){ desde = sumarDias(p.desde, -7); hasta = sumarDias(p.hastaEf, -7); etiqueta = 'la semana anterior'; }
  else if (p.modo === 'mes'){
    desde = mesAnterior(p.desde);
    var finPrev = finMes(desde);
    if (p.hastaEf === finMes(p.desde)) hasta = finPrev;
    else { var dd = +p.hastaEf.slice(8); hasta = desde.slice(0, 8) + pad(dd); if (hasta > finPrev) hasta = finPrev; }
    etiqueta = 'el mes anterior';
  } else {                                           // rango
    var len = isoNum(p.hastaEf) - isoNum(p.desde) + 1;
    desde = sumarDias(p.desde, -len); hasta = sumarDias(p.desde, -1); etiqueta = 'el tramo anterior (' + len + ' días)';
  }
  var fechas = cargados(m, desde, hasta), nEsp = isoNum(hasta) - isoNum(desde) + 1;
  return { desde: desde, hasta: hasta, fechas: fechas, nEsperados: nEsp, completo: fechas.length === nEsp, etiqueta: etiqueta };
}

/* ---------- Evolución ---------- */
function serieDiaria(m, desde, hasta){
  return rango(desde, hasta).map(function(f){
    var d = m.dias[f];
    if (!d) return { fecha: f, tiene: false, u: 0, c: 0, centros: {}, centrosU: {}, cats: {}, catsU: {}, prov: {}, provU: {} };
    var s = { fecha: f, tiene: true, u: d.tot.u, c: d.tot.c, centros: {}, centrosU: {}, cats: {}, catsU: {}, prov: {}, provU: {} };
    d.centros.forEach(function(cn, i){ s.centros[cn] = d.porCentro[i].c; s.centrosU[cn] = d.porCentro[i].u; });
    d.filas.forEach(function(r){
      if (r.ex) return;
      var cat = catDe(m, r.k), tc = 0, tu = 0;
      for (var i = 0; i < r.c.length; i++){ tc += r.c[i]; tu += r.u[i]; }
      s.cats[cat] = (s.cats[cat] || 0) + tc; s.catsU[cat] = (s.catsU[cat] || 0) + tu;
      if (cat === CFG.entradas){ var df = m.clasif.productos[r.k], pv = (df && df.v) || CFG.sinProveedor; s.prov[pv] = (s.prov[pv] || 0) + tc; s.provU[pv] = (s.provU[pv] || 0) + tu; }
    });
    return s;
  });
}
function mediaPorDiaSemana(serie){
  var acc = [0, 1, 2, 3, 4, 5, 6].map(function(){ return { n: 0, c: 0, u: 0 }; });
  serie.forEach(function(s){ if (s.tiene){ var w = acc[diaSemana(s.fecha)]; w.n++; w.c += s.c; w.u += s.u; } });
  return acc.map(function(w, i){ return { dia: DIAS_L[i], corto: DIAS_C[i], n: w.n, c: w.n ? w.c / w.n : 0, u: w.n ? w.u / w.n : 0 }; });
}

/* ============================================================
   SERVICIO: comensales (comidas y cenas) y última llamada, de los datos de operaciones.
   Regla: si una fecha tiene varios registros, vale el ÚLTIMO de la lista.
   ============================================================ */
/* Minutos de la hora «HH:MM». La madrugada (00:00–05:59) cuenta como la noche anterior: 00:23 → 24:23. */
function llamadaMin(l){ var p = /^(\d{1,2}):(\d{2})$/.exec(l || ''); if (!p) return null; var h = +p[1], mi = +p[2]; if (h > 23 || mi > 59) return null; return (h < 6 ? h + 24 : h) * 60 + mi; }
/* Una última llamada entre las 06:00 y las 11:59 no es creíble para un restaurante de noche (casi seguro es 12 h mal escritas): se marca y no entra en las medias. */
function llamadaDudosa(l){ var p = /^(\d{1,2}):(\d{2})$/.exec(l || ''); if (!p) return false; var h = +p[1]; return h >= 6 && h < 12; }
function fmtLlamada(min){ if (min === null || min === undefined || isNaN(min)) return '—'; var t = Math.round(min) % 1440; return pad(Math.floor(t / 60)) + ':' + pad(t % 60); }
/* lista: [{f: 'AAAA-MM-DD', c: comidas, e: cenas, l: 'HH:MM'}] en el orden recibido */
function crearServicio(lista){
  var dias = {}, n = {};
  (lista || []).forEach(function(x){
    if (!x || !esIso(x.f)) return;
    n[x.f] = (n[x.f] || 0) + 1;
    var c = x.c > 0 ? Math.round(x.c) : 0, e = x.e > 0 ? Math.round(x.e) : 0, tt = x.t > 0 ? Math.round(x.t) : (c + e);
    var ns = (x.n === null || x.n === undefined || !isFinite(x.n)) ? null : (x.n > 0 ? Math.round(x.n) : 0);
    dias[x.f] = { f: x.f, c: c, e: e, t: tt, l: x.l || '', n: ns };           // el último registro de la fecha sustituye al anterior
  });
  var fechas = Object.keys(dias).sort();
  fechas.forEach(function(f){ var d = dias[f]; d.r = n[f]; d.dud = llamadaDudosa(d.l); d.lm = d.dud ? null : llamadaMin(d.l); });
  return { dias: dias, fechas: fechas, registros: (lista || []).length, repetidos: fechas.filter(function(f){ return dias[f].r > 1; }).length };
}
/* Resumen de [desde, hasta]. Las ventas (en céntimos) salen del modelo de ventas m. */
function servicioPeriodo(sv, m, desde, hasta){
  var r = { desde: desde, hasta: hasta, regs: 0, dias: 0, c: 0, e: 0, t: 0, diasC: 0, diasE: 0, ventas: 0, tVentas: 0, diasVentas: 0, ns: 0, diasNs: 0, llam: [], dud: 0, repetidos: 0, sinRegistro: 0, sinVentas: 0 };
  if (!(desde <= hasta)) return finServicio(r);
  rango(desde, hasta).forEach(function(f){
    var d = sv.dias[f], v = m.dias[f];

<script>
/* ============================================================
   Cierre de caja · Trattoria Sant Arcangelo
   Réplica del cierre de La Negra Tomasa con las formas de pago de la Trattoria en Ágora.
   Todo pasa por el servicio (acción «caja»): en esta página no hay ninguna clave.
   ============================================================ */
window.CAJA = (function(){
'use strict';
var SES_CAJA = 'trattoria_caja_v1', BORRADOR = 'trattoria_caja_borrador_v1', SES_ED = 'trattoria_caja_edicion_v1';
var MARCA = '<div class="marca"><span class="rotulo">Trattoria<small>Sant Arcangelo</small></span></div>';
var C = { raiz: null, modo: 'socio', token: '', nombre: '', cfg: null, vista: 'nuevo', f: null, guardando: false, ultimo: null, msg: null,
  lista: null, mes: '', det: null, fotos: null, emp: null, cargando: false, aviso: null, ed: null, edPide: false, edMsg: '' };

function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function eur(n){ n = Number(n) || 0; return n.toLocaleString('es-ES', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' €'; }
function num(v){ if (v === '' || v == null) return 0; var n = Number(String(v).replace(',', '.')); return isFinite(n) ? n : 0; }
function pad(n){ return (n < 10 ? '0' : '') + n; }
function hoyLocal(){ var d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function fechaTxt(iso){ var p = String(iso || '').split('-'); return p.length === 3 ? p[2] + '/' + p[1] + '/' + p[0] : ''; }
function guardarLS(k, v){ try { if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, JSON.stringify(v)); } catch (e){} }
function leerLS(k){ try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e){ return null; } }
function sesionCaja(){ var s = leerLS(SES_CAJA); return s && s.token && s.expira && Date.parse(s.expira) > Date.now() ? s : null; }
function sesionEd(){ var s = leerLS(SES_ED); return s && s.edicion && s.expira && Date.parse(s.expira) > Date.now() ? s : null; }   // edición de cierres: solo Jorge, con su código
function fotoHtml(v, alt, peq){ return /^data:image\//.test(v || '') ? '<img class="cj-foto' + (peq ? ' peq' : '') + '" src="' + esc(v) + '" alt="' + alt + '">' : (v ? '<p class="sub-txt">Hay una foto guardada (no se ha podido mostrar). Se conserva.</p>' : ''); }
async function pedir(op, datos){ return API.accion('caja', Object.assign({ op: op }, datos || {}), C.token || undefined); }

/* ---------- Formulario ---------- */

function calc(f){

  cfg.billetes.concat(cfg.monedas).forEach(function(v){ cont += (Number(f.denom[String(v)]) || 0) * v; });

  var tf = cfg.formas.reduce(function(s, k){ return s + num(f.formas[k]); }, 0), rec = cont + tg + tr;
  return { efectivo: cont, gastos: tg, retiros: tr, recaudacion: rec, formas: tf, total: rec + tf };
}
function guardarBorrador(){ if (C.f && !C.ed) guardarLS(BORRADOR, Object.assign({}, C.f, { fotoEfectivo: '', gastos: C.f.gastos.map(function(g){ return Object.assign({}, g, { foto: '' }); }), quien: C.modo === 'caja' ? C.nombre : 'socio' })); }

        '<button type="button" class="cj-pm" data-cj="den" data-v="' + v + '" data-d="1" aria-label="Uno más de ' + nombreDenom(v) + '">+</button><span class="cj-sub" id="cj-sub-' + String(v).replace('.', '_') + '">' + (q ? eur(q * v) : '') + '</span></div>'; }).join('') +
    '</div><div class="cj-linea fuerte"><span>Total efectivo contado</span><span id="cj-t-efectivo">' + eur(c.efectivo) + '</span></div></section>';
  h += '<section class="bloque cj-card"><h2><span class="cj-n">4</span>Gastos pagados con la caja</h2>' + lineasHtml('gastos', [['concepto', 'Concepto del gasto'], ['autorizado', 'Autorizado por']], true) + '</section>';
  h += '<section class="bloque cj-card"><h2><span class="cj-n">5</span>Retiros (socios / propietarios)</h2>' + lineasHtml('retiros', [['persona', 'Quién hizo el retiro'], ['motivo', 'Motivo']], false) + '</section>';
  h += '<section class="bloque cj-card"><h2><span class="cj-n">6</span>Recaudación en efectivo</h2>' +
    '<div class="cj-linea"><span>Efectivo contado</span><span id="cj-r-efectivo">' + eur(c.efectivo) + '</span></div><div class="cj-linea"><span>Gastos</span><span id="cj-r-gastos">' + eur(c.gastos) + '</span></div>' +
    '<div class="cj-linea"><span>Retiros</span><span id="cj-r-retiros">' + eur(c.retiros) + '</span></div><div class="cj-linea fuerte"><span>Recaudación en efectivo</span><span id="cj-r-rec">' + eur(c.recaudacion) + '</span></div></section>';
  h += '<section class="bloque cj-card"><h2><span class="cj-n">7</span>Otras formas de pago</h2><p class="sub-txt">Las formas de pago de la Trattoria en Ágora. La tarjeta es el total del ticket de cierre del datáfono (si no se cobró nada con tarjeta, escribe 0). Las demás, el total del día en cada plataforma; si no hubo, déjalas vacías.</p><div class="cj-dos">' +
    cfg.formas.map(function(k){ return '<div><label for="cj-fp-' + esc(k) + '">' + esc(etiquetaForma(k)) + (k === 'Tarjeta' ? ' *' : '') + '</label><input class="campo cj-imp" id="cj-fp-' + esc(k) + '" data-cjf="forma" data-k="' + esc(k) + '" inputmode="decimal" placeholder="0,00" value="' + esc(f.formas[k] == null ? '' : f.formas[k]) + '"></div>'; }).join('') +
    '</div><div class="cj-linea fuerte"><span>Total otras formas de pago</span><span id="cj-t-formas">' + eur(c.formas) + '</span></div></section>';

function lineasHtml(tipo, campos, foto){

function detalleHtml(e, fotos){

    .concat(formas.map(function(k){ return fila(esc(etiquetaForma(k)), eur((e.formas || {})[k])); })).concat([fila('Total otras formas de pago', eur(e.totalFormas), 'fuerte'), fila('TOTAL DEL DÍA', eur(e.totalDia), 'total')]));

/* ---------- Fotos ---------- */
function comprimir(file){
  return new Promise(function(ok, ko){
    var r = new FileReader();
    r.onload = function(){ var img = new Image(); img.onload = function(){
      var max = 1280, w = img.width, hh = img.height, k = Math.min(1, max / Math.max(w, hh)), cv = document.createElement('canvas');
      cv.width = Math.round(w * k); cv.height = Math.round(hh * k); cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      var q = 0.7, d = cv.toDataURL('image/jpeg', q); while (d.length > 1400000 && q > 0.3){ q -= 0.1; d = cv.toDataURL('image/jpeg', q); }
      ok(d); }; img.onerror = function(){ ko(new Error('No se ha podido leer la foto.')); }; img.src = r.result; };
    r.onerror = function(){ ko(new Error('No se ha podido leer la foto.')); }; r.readAsDataURL(file);
  });
}

document.addEventListener('keydown', function(ev){ if (ev.key === 'Enter' && ev.target && ev.target.id === 'cj-edc' && C.raiz && C.raiz.contains(ev.target)) entrarEdicion(); });
document.addEventListener('change', function(ev){ if (C.raiz && C.raiz.contains(ev.target)) cambio(ev.target); });

/* ---------- Entradas desde la página ---------- */
async function preparar(){
  if (!C.cfg){ C.cargando = true; pintar(); C.cfg = await pedir('config'); C.cargando = false; }
  if (!C.f){
    var b = leerLS(BORRADOR), quien = C.modo === 'caja' ? C.nombre : 'socio';
    C.f = formVacio();
    if (b && b.quien === quien && b.fecha){ ['fecha', 'turno', 'empleado', 'fondoInicial', 'observaciones'].forEach(function(k){ if (b[k] != null) C.f[k] = b[k]; }); C.f.denom = b.denom || {}; C.f.formas = b.formas || {}; C.f.gastos = b.gastos || []; C.f.retiros = b.retiros || []; if (C.modo === 'caja') C.f.empleado = C.nombre; C.aviso = 'Se ha recuperado el cierre que estaba a medias en este dispositivo (sin las fotos).'; }
  }
}
/* Pestaña dentro del panel de socios */
async function montar(el, token){
  if (C.modo !== 'socio' || C.token !== token){ C = Object.assign(C, { modo: 'socio', token: token, nombre: '', f: null, lista: null, emp: null, ultimo: null, det: null, vista: 'nuevo', ed: null, edPide: false, edMsg: '' }); }
  C.raiz = el;
  try { await preparar(); } catch (e){ return fallo(e); }
  pintar(); if (C.vista === 'historial' && !C.lista) cargarLista(); if (C.vista === 'encargados' && !C.emp) cargarEmp();
}
/* Pantalla de entrada del encargado */
async function acceso(app, error){
  C.app = app;
  app.innerHTML = '<header class="cab"><div class="cab-in">' + MARCA + '<div class="cab-txt"><b>Cierre de caja</b><small>Acceso para encargados</small></div></div></header><main class="pag"><section class="bloque acceso"><h2>Entra con tu código</h2>' +
    '<p class="sub-txt">Solo hay que hacerlo una vez en cada teléfono. Si no tienes código, pídeselo a Jorge.</p>' + (error ? '<div class="aviso err" role="alert">' + esc(error) + '</div>' : '') +
    '<div id="cj-acc"><p class="sub-txt">Cargando la lista de encargados…</p></div><p style="margin-top:22px"><button type="button" class="enlace" id="cj-volver">Volver al panel de socios</button></p></section></main>';
  document.getElementById('cj-volver').onclick = function(){ guardarLS(SES_CAJA, null); window.__viewer.iniciar(); };
  var cfg; try { cfg = await API.accion('caja', { op: 'config' }); } catch (e){ document.getElementById('cj-acc').innerHTML = '<div class="aviso err">' + esc(e.message) + '</div>'; return; }
  var box = document.getElementById('cj-acc'); if (!box) return;
  if (!cfg.empleados.length){ box.innerHTML = '<div class="aviso warn">Todavía no hay encargados dados de alta. Jorge o un socio tiene que añadirlos en «Cierre de caja → Encargados».</div>'; return; }
  box.innerHTML = '<label for="cj-ln">Tu nombre</label><select class="sel" id="cj-ln"><option value="">Elige tu nombre</option>' + cfg.empleados.map(function(n){ return '<option>' + esc(n) + '</option>'; }).join('') + '</select>' +
    '<label for="cj-lc" style="margin-top:12px">Tu código</label><input class="campo" id="cj-lc" type="password" inputmode="numeric" maxlength="8" autocomplete="one-time-code"><p style="margin-top:14px"><button type="button" class="btn" id="cj-lb">Entrar</button></p>';
  var ir = async function(){
    var n = document.getElementById('cj-ln').value, c = document.getElementById('cj-lc').value.trim();
    if (!n || !c) return acceso(app, 'Elige tu nombre y escribe tu código.');
    document.getElementById('cj-lb').disabled = true;
    try { var r = await API.accion('caja', { op: 'login', nombre: n, codigo: c }); guardarLS(SES_CAJA, { token: r.token, nombre: r.nombre, expira: r.expira }); soloCaja(app); }
    catch (e){ acceso(app, e.message); }
  };
  document.getElementById('cj-lb').onclick = ir; document.getElementById('cj-lc').onkeydown = function(e){ if (e.key === 'Enter') ir(); };
}
/* Encargado: solo el formulario del cierre, nunca las ventas */
async function soloCaja(app){
  var s = sesionCaja(); if (!s) return acceso(app);
  C = Object.assign(C, { modo: 'caja', token: s.token, nombre: s.nombre, app: app, vista: 'nuevo', f: null, ultimo: null, msg: null });
  app.innerHTML = '<header class="cab"><div class="cab-in">' + MARCA + '<div class="cab-txt"><b>Cierre de caja</b><small>' + esc(s.nombre) + ' · <button type="button" class="enlace" id="cj-salir">Salir</button></small></div></div></header><main class="pag"><div id="caja-raiz"></div></main>';
  document.getElementById('cj-salir').onclick = function(){ if (!confirm('¿Salir? Tendrás que volver a escribir tu código en este teléfono.')) return; guardarLS(SES_CAJA, null); C.token = ''; window.__viewer.iniciar(); };
  C.raiz = document.getElementById('caja-raiz');
  try { await preparar(); } catch (e){ return fallo(e); }
  pintar();
}
return { montar: montar, acceso: acceso, soloCaja: soloCaja, sesion: sesionCaja, _C: function(){ return C; } };
})();

</script>
<script>
/* ============================================================
   Cuadre de caja automático · Trattoria Sant Arcangelo
   Ventas y cobros de Ágora (cada mañana, 06:20) frente a los cierres de caja de los encargados.
   Solo Jose, Jorge y Laura: además de la contraseña de los socios, nombre + código del cuadre.
   El código no está en esta página: lo comprueba el servicio (acción «cuadre»).
   ============================================================ */
window.CUADRE = (function(){
'use strict';
var SES_CD = 'trattoria_cuadre_v1', PERSONAS = ['Jose', 'Jorge', 'Laura'], TOLERANCIA = 100;   // céntimos: hasta 1 € se considera cuadrado
var D = { raiz: null, token: '', ses: null, datos: null, dia: '', cargando: false, msg: null, rellenando: false };

function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function eur(c){ return ((Number(c) || 0) / 100).toLocaleString('es-ES', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' €'; }
function difTxt(c){ return (c > 0 ? '+' : c < 0 ? '−' : '') + eur(Math.abs(c)); }
function norm(t){ return String(t || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/\s+/g, ' ').trim(); }
var DS = ['dom', 'lun', 'mar', 'mié', 'jue', 'vie', 'sáb'], MS = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
function fLarga(iso){ var p = iso.split('-'), d = new Date(Date.UTC(+p[0], +p[1] - 1, +p[2])); return DS[d.getUTCDay()] + ' ' + (+p[2]) + ' de ' + MS[+p[1] - 1] + ' ' + p[0]; }
function fCorta(iso){ var p = iso.split('-'), d = new Date(Date.UTC(+p[0], +p[1] - 1, +p[2])); return DS[d.getUTCDay()] + ' ' + p[2] + '/' + p[1]; }
function mesTxt(m){ var p = m.split('-'); return MS[+p[1] - 1].charAt(0).toUpperCase() + MS[+p[1] - 1].slice(1) + ' ' + p[0]; }
function leerSes(){ try { var s = JSON.parse(localStorage.getItem(SES_CD) || 'null'); return s && s.cuadre && Date.parse(s.expira) > Date.now() ? s : null; } catch (e){ return null; } }
function ponerSes(s){ try { if (s) localStorage.setItem(SES_CD, JSON.stringify(s)); else localStorage.removeItem(SES_CD); } catch (e){} }
async function pedir(op, extra){ return API.accion('cuadre', Object.assign({ op: op, cuadre: D.ses ? D.ses.cuadre : '' }, extra || {}), D.token); }

/* ---------- Cálculo de la conciliación (por jornada) ---------- */
function esEfectivo(m){ var n = norm(m); return n.indexOf('efectivo') >= 0 || n === 'cash' || n === 'contado'; }
function formaDe(m, formas){
  if (esEfectivo(m)) return 'Efectivo';
  var n = norm(m);
  for (var i = 0; i < formas.length; i++){ var k = norm(formas[i]); if (n === k || n.indexOf(k) === 0 || k.indexOf(n) === 0) return formas[i]; }
  return null;
}
function etiqueta(k){ return k === 'UBER' ? 'Uber' : k === 'GLOVO' ? 'Glovo' : k === 'TRANSFERENCIA' ? 'Transferencia' : k; }
function jornada(dia){
  var x = D.datos, ag = x.dias[dia] || null, cs = x.cierres[dia] || [], formas = x.formasCierre || ['Tarjeta', 'UBER', 'GLOVO', 'TRANSFERENCIA'];
  var filas = [{ k: 'Efectivo', ag: 0, pr: 0, ci: 0 }].concat(formas.map(function(f){ return { k: f, ag: 0, pr: 0, ci: 0 }; })), por = {};
  filas.forEach(function(f){ por[f.k] = f; });
  var fila = function(m){ var k = formaDe(m, formas); if (k) return por[k]; return por['ag:' + m] || (por['ag:' + m] = filas[filas.push({ k: m, ag: 0, pr: 0, ci: 0, soloAgora: true }) - 1]); };
  if (ag){
    Object.keys(ag.total.c).forEach(function(m){ fila(m).ag += ag.total.c[m]; });
    Object.keys(ag.total.p || {}).forEach(function(m){ fila(m).pr += ag.total.p[m]; });   // propinas que Ágora apunta en cada cobro
  }
  cs.forEach(function(c){ por.Efectivo.ci += c.rec; formas.forEach(function(f){ por[f].ci += (c.formas || {})[f] || 0; }); });
  var tAg = 0, tPr = 0, tCi = 0; filas.forEach(function(f){ f.esp = f.ag + f.pr; f.dif = f.ci - f.esp; tAg += f.ag; tPr += f.pr; tCi += f.ci; });
  var estado = !ag ? 'sinagora' : !cs.length ? 'sincierre' : Math.abs(tCi - tAg - tPr) > TOLERANCIA || filas.some(function(f){ return !f.soloAgora && Math.abs(f.dif) > TOLERANCIA; }) || filas.some(function(f){ return f.soloAgora && f.esp; }) ? 'descuadre' : 'ok';
  return { dia: dia, ag: ag, cierres: cs, filas: filas.filter(function(f){ return f.ag || f.pr || f.ci || f.k === 'Efectivo' || f.k === 'Tarjeta'; }), tAg: tAg, tPr: tPr, tCi: tCi, dif: tCi - tAg - tPr, estado: estado };
}
var ESTADOS = { ok: ['Cuadra', 'cd-ok'], descuadre: ['Descuadre', 'cd-mal'], sincierre: ['Falta el cierre', 'cd-mal'], sinagora: ['Sin datos de Ágora', 'cd-gris'] };
function chip(e){ var s = ESTADOS[e]; return '<span class="cd-chip ' + s[1] + '">' + s[0] + '</span>'; }
function difCelda(c){ return '<td class="n ' + (Math.abs(c) > TOLERANCIA ? 'cd-rojo' : 'cd-verde') + '">' + difTxt(c) + '</td>'; }
function jornadas(){
  var set = {};
  Object.keys(D.datos.dias).forEach(function(d){ set[d] = 1; });
  Object.keys(D.datos.cierres).forEach(function(d){ if (d >= '2026-10-24') set[d] = 1; });
  return Object.keys(set).sort();
}

/* ---------- Vistas ---------- */
function vistaAcceso(err){
  return '<section class="bloque acceso"><h2>Cuadre de caja</h2><p class="sub-txt">Apartado reservado a Jose, Jorge y Laura. Elige tu nombre y escribe el código del cuadre.</p>' +
    (err ? '<div class="aviso err" role="alert">' + esc(err) + '</div>' : '') +
    '<label for="cd-n">Tu nombre</label><select class="sel" id="cd-n"><option value="">Elige tu nombre</option>' + PERSONAS.map(function(p){ return '<option>' + p + '</option>'; }).join('') + '</select>' +
    '<label for="cd-c" style="margin-top:12px">Código del cuadre</label><input class="campo" id="cd-c" type="password" inputmode="numeric" maxlength="8" autocomplete="off">' +
    '<p style="margin-top:14px"><button type="button" class="btn" data-cd="entrar">Entrar</button></p></section>';
}
function vistaDia(j){
  var h = '<section class="bloque"><div class="cd-nav"><button type="button" class="flecha" data-cd="mover" data-v="-1" aria-label="Día anterior"' + (j.prev ? '' : ' disabled') + '>‹</button>' +
    '<select class="sel" data-cdf="dia" aria-label="Jornada">' + jornadas().slice().reverse().map(function(d){ return '<option value="' + d + '"' + (d === j.dia ? ' selected' : '') + '>' + fLarga(d) + '</option>'; }).join('') + '</select>' +
    '<button type="button" class="flecha" data-cd="mover" data-v="1" aria-label="Día siguiente"' + (j.next ? '' : ' disabled') + '>›</button></div>' +
    '<p class="cd-estado">' + chip(j.estado) + (j.ag && j.cierres.length ? ' <span class="sub-txt">Diferencia total: <b>' + difTxt(j.dif) + '</b></span>' : '') + '</p></section>';
  // Conciliación
  h += '<section class="bloque"><h2>Ágora frente al cierre de caja</h2>';
  if (!j.ag) h += '<div class="aviso warn">Todavía no están los datos de Ágora de esta jornada. Se cargan solos cada mañana sobre las 06:20.</div>';
  if (!j.cierres.length) h += '<div class="aviso err"><b>No hay cierre de caja de esta jornada.</b> El cierre es obligatorio todos los días.</div>';
  h += '<div class="cj-scroll"><table class="cj-tabla"><thead><tr><th>Forma de pago</th><th class="n">Ágora</th><th class="n">Propinas</th><th class="n">Ágora + propinas</th><th class="n">Cierre de caja</th><th class="n">Diferencia</th></tr></thead><tbody>' +
    j.filas.map(function(f){ return '<tr><td>' + esc(etiqueta(f.k)) + (f.soloAgora ? ' <small>(no está en el cierre)</small>' : '') + '</td><td class="n">' + eur(f.ag) + '</td><td class="n">' + (f.pr ? eur(f.pr) : '—') + '</td><td class="n">' + eur(f.esp) + '</td><td class="n">' + (f.soloAgora ? '—' : eur(f.ci)) + '</td>' + difCelda(f.dif) + '</tr>'; }).join('') +
    '<tr class="total"><td>Total</td><td class="n">' + eur(j.tAg) + '</td><td class="n">' + eur(j.tPr) + '</td><td class="n">' + eur(j.tAg + j.tPr) + '</td><td class="n">' + eur(j.tCi) + '</td>' + difCelda(j.dif) + '</tr></tbody></table></div>' +
    '<p class="sub-txt" style="margin-top:8px">Diferencia = cierre de caja − (Ágora + propinas). En positivo, hay más dinero en el cierre que en Ágora; en negativo, falta. Las propinas son las que Ágora apunta en cada cobro: las de tarjeta van en el datáfono; las de efectivo solo cuentan si se registran en Ágora. El efectivo del cierre es la recaudación (contado + gastos + retiros).</p></section>';
  // Ventas de Ágora por centro
  if (j.ag){
    var ks = Object.keys(j.ag.centros), cob = function(x){ return Object.keys(x.c).reduce(function(s, m){ return s + x.c[m]; }, 0); }, prop = function(x){ return Object.keys(x.p || {}).reduce(function(s, m){ return s + x.p[m]; }, 0); };
    var tc = cob(j.ag.total);
    h += '<section class="bloque"><h2>Ventas en Ágora</h2><div class="cj-scroll"><table class="cj-tabla"><thead><tr><th>Centro</th><th class="n">Tickets</th><th class="n">Ventas</th><th class="n">Cobrado</th><th class="n">Propinas</th></tr></thead><tbody>' +
      ks.map(function(k){ var x = j.ag.centros[k]; return '<tr><td>' + esc(k) + '</td><td class="n">' + x.t + '</td><td class="n">' + eur(x.v) + '</td><td class="n">' + eur(cob(x)) + '</td><td class="n">' + (prop(x) ? eur(prop(x)) : '—') + '</td></tr>'; }).join('') +
      '<tr class="total"><td>Total</td><td class="n">' + j.ag.total.t + '</td><td class="n">' + eur(j.ag.total.v) + '</td><td class="n">' + eur(tc) + '</td><td class="n">' + eur(prop(j.ag.total)) + '</td></tr></tbody></table></div>' +
      (Math.abs(tc - j.ag.total.v) > TOLERANCIA ? '<div class="aviso warn" style="margin-top:10px">En Ágora, lo cobrado (' + eur(tc) + ') no coincide con las ventas (' + eur(j.ag.total.v) + '): diferencia ' + difTxt(tc - j.ag.total.v) + '. Puede haber tickets sin cobrar, propinas o invitaciones.</div>' : '') +
      (j.ag.cerrada ? '' : '<p class="sub-txt" style="margin-top:8px">Ojo: cuando se guardó, la jornada no estaba cerrada en Ágora.</p>') + '</section>';
  }
  // Cierres de los encargados
  if (j.cierres.length){
    var fm = D.datos.formasCierre || [];
    h += '<section class="bloque"><h2>Cierres de caja de la jornada</h2><div class="cj-scroll"><table class="cj-tabla"><thead><tr><th>Turno</th><th>Encargado</th><th>Guardado</th><th class="n">Efectivo</th>' + fm.map(function(k){ return '<th class="n">' + esc(etiqueta(k)) + '</th>'; }).join('') + '<th class="n">Total</th></tr></thead><tbody>' +
      j.cierres.map(function(c){ var t = c.rec + fm.reduce(function(s, k){ return s + ((c.formas || {})[k] || 0); }, 0);
        return '<tr><td>' + esc(c.turno) + (c.dud ? ' <small>(fecha escrita: ' + esc(c.dud.split('-').reverse().join('/')) + ')</small>' : '') + '</td><td>' + esc(c.emp) + '</td><td>' + esc(c.hora) + '</td><td class="n">' + eur(c.rec) + '</td>' + fm.map(function(k){ return '<td class="n">' + eur((c.formas || {})[k] || 0) + '</td>'; }).join('') + '<td class="n"><b>' + eur(t) + '</b></td></tr>'; }).join('') +
      '</tbody></table></div><p class="sub-txt" style="margin-top:8px">El detalle de cada cierre (arqueo, gastos, retiros y fotos) está en «Cierre de caja → Historial».</p></section>';
  }
  return h;
}
function vistaMes(mes){
  var dias = jornadas().filter(function(d){ return d.slice(0, 7) === mes; }), js = dias.map(jornada), tot = { ag: 0, ci: 0, dif: 0 };
  var meses = {}; jornadas().forEach(function(d){ meses[d.slice(0, 7)] = 1; });
  var cuenta = { ok: 0, descuadre: 0, sincierre: 0, sinagora: 0 }; tot.pr = 0; js.forEach(function(j){ cuenta[j.estado]++; tot.ag += j.tAg; tot.pr += j.tPr; tot.ci += j.tCi; if (j.ag && j.cierres.length) tot.dif += j.dif; });
  var h = '<section class="bloque"><div class="bloque-cab"><h2>Resumen del mes</h2><select class="sel cd-mes" data-cdf="mes" aria-label="Mes">' + Object.keys(meses).sort().reverse().map(function(m){ return '<option value="' + m + '"' + (m === mes ? ' selected' : '') + '>' + mesTxt(m) + '</option>'; }).join('') + '</select></div>' +
    '<p class="sub-txt">' + cuenta.ok + ' cuadran · ' + cuenta.descuadre + ' con descuadre · ' + cuenta.sincierre + ' sin cierre de caja' + (cuenta.sinagora ? ' · ' + cuenta.sinagora + ' sin datos de Ágora' : '') + '</p>' +
    '<div class="cj-scroll"><table class="cj-tabla cd-mesT"><thead><tr><th>Día</th><th class="n">Ventas</th><th class="n">Cobrado Ágora</th><th class="n">Propinas</th><th class="n">Cierre de caja</th><th class="n">Diferencia</th><th>Estado</th></tr></thead><tbody>' +
    js.slice().reverse().map(function(j){ return '<tr class="cd-fila" data-cd="ir" data-v="' + j.dia + '"' + (j.dia === D.dia ? ' aria-current="true"' : '') + '><td>' + fCorta(j.dia) + '</td><td class="n">' + (j.ag ? eur(j.ag.total.v) : '—') + '</td><td class="n">' + (j.ag ? eur(j.tAg) : '—') + '</td><td class="n">' + (j.ag ? eur(j.tPr) : '—') + '</td><td class="n">' + (j.cierres.length ? eur(j.tCi) : '—') + '</td>' + (j.ag && j.cierres.length ? difCelda(j.dif) : '<td class="n">—</td>') + '<td>' + chip(j.estado) + '</td></tr>'; }).join('') +
    '<tr class="total"><td>Total</td><td></td><td class="n">' + eur(tot.ag) + '</td><td class="n">' + eur(tot.pr) + '</td><td class="n">' + eur(tot.ci) + '</td>' + difCelda(tot.dif) + '<td><small>días con los dos datos</small></td></tr></tbody></table></div>' +
    '<p class="cj-botones" style="margin-top:12px"><button type="button" class="btn claro peq" data-cd="csv" data-v="' + mes + '">Descargar Excel del mes</button></p></section>';
  return h;
}
function pintar(){
  var r = D.raiz; if (!r) return;
  if (!D.ses){ r.innerHTML = vistaAcceso(D.msg && D.msg.err); var c = document.getElementById('cd-c'); if (c) c.onkeydown = function(e){ if (e.key === 'Enter') entrar(); }; return; }
  var cab = '<p class="cd-quien">Cuadre de caja · <b>' + esc(D.ses.nombre) + '</b> · <button type="button" class="enlace" data-cd="salir">Salir del cuadre</button></p>';
  if (D.cargando){ r.innerHTML = cab + '<div class="carga" role="status"><b>Cargando el cuadre…</b></div>'; return; }
  var h = cab + (D.msg && D.msg.err ? '<div class="aviso err">' + esc(D.msg.err) + '</div>' : '') + (D.msg && D.msg.ok ? '<div class="aviso ok">' + esc(D.msg.ok) + '</div>' : '');
  if (!D.datos){ r.innerHTML = h + '<button type="button" class="btn" data-cd="recargar">Reintentar</button>'; return; }
  var lista = jornadas();
  if (D.datos.avisoCierres) h += '<div class="aviso warn">' + esc(D.datos.avisoCierres) + '</div>';
  if (!lista.length) h += '<section class="bloque"><div class="aviso info">Todavía no hay ningún día en el cuadre.</div></section>';
  else {
    if (!D.dia || lista.indexOf(D.dia) < 0) D.dia = lista[lista.length - 1];
    var i = lista.indexOf(D.dia), j = jornada(D.dia); j.prev = i > 0; j.next = i < lista.length - 1;
    h += vistaDia(j) + vistaMes(D.mes && D.mes.length === 7 ? D.mes : D.dia.slice(0, 7));
  }

async function entrar(){

}

function csv(mes){
  var fm = D.datos.formasCierre || [], e = function(v){ return Math.round(Number(v || 0)) / 100; }, sum = {};
  var cab = ['Jornada', 'Estado', 'Ventas Ágora', 'Cobrado Ágora', 'Propinas Ágora', 'Cierre de caja', 'Diferencia', 'Efectivo Ágora', 'Propinas Efectivo', 'Efectivo cierre'].concat(fm.map(function(k){ return etiqueta(k) + ' Ágora'; }), fm.map(function(k){ return 'Propinas ' + etiqueta(k); }), fm.map(function(k){ return etiqueta(k) + ' cierre'; }), ['Cierres']);
  var filas = [cab], ac = function(i, v){ sum[i] = (sum[i] || 0) + v; return v; };
  jornadas().filter(function(d){ return d.slice(0, 7) === mes; }).forEach(function(d){
    var j = jornada(d), f = {}; j.filas.forEach(function(x){ f[x.k] = x; });
    var g = function(k, c){ return f[k] ? f[k][c] : 0; }, ambos = !!(j.ag && j.cierres.length);
    var fila = [d.split('-').reverse().join('/'), ESTADOS[j.estado][0], j.ag ? e(j.ag.total.v) : '', j.ag ? e(j.tAg) : '', j.ag ? e(j.tPr) : '', j.cierres.length ? e(j.tCi) : '', ambos ? e(j.dif) : '',
      j.ag ? e(g('Efectivo', 'ag')) : '', j.ag ? e(g('Efectivo', 'pr')) : '', j.cierres.length ? e(g('Efectivo', 'ci')) : '']
      .concat(fm.map(function(k){ return j.ag ? e(g(k, 'ag')) : ''; }), fm.map(function(k){ return j.ag ? e(g(k, 'pr')) : ''; }), fm.map(function(k){ return j.cierres.length ? e(g(k, 'ci')) : ''; }), [j.cierres.map(function(c){ return c.turno + ' ' + c.emp; }).join(' / ')]);
    fila.forEach(function(v, i){ if (i >= 2 && typeof v === 'number') ac(i, v); });
    filas.push(fila);
  });
  var tot = cab.map(function(_, i){ return i === 0 ? 'Total' : (i >= 2 && i < cab.length - 1 && sum[i] != null) ? Math.round(sum[i] * 100) / 100 : ''; });
  filas.push(tot);
  XLSX.descargar('cuadre_trattoria_' + mes + '.xlsx', 'Cuadre ' + mes, filas, { totales: true });
}
function alClic(ev){
  var b = ev.target.closest ? ev.target.closest('[data-cd]') : null; if (!b || b.disabled || !D.raiz.contains(b)) return;
  var a = b.dataset.cd, v = b.dataset.v;
  if (a === 'entrar') return entrar();
  if (a === 'salir') return salir();
  if (a === 'recargar') return cargar();
  if (a === 'rellenar') return rellenar();
  if (a === 'csv') return csv(v);
  if (a === 'mover'){ var l = jornadas(), i = l.indexOf(D.dia) + Number(v); if (i >= 0 && i < l.length){ D.dia = l[i]; D.mes = D.dia.slice(0, 7); } pintar(); return; }
  if (a === 'ir'){ D.dia = v; pintar(); window.scrollTo(0, 0); return; }
}
function alCambiar(ev){
  var t = ev.target, f = t.dataset && t.dataset.cdf; if (!f) return;

function montar(raiz, token){

}
function olvidar(){ ponerSes(null); D.ses = null; D.datos = null; }
return { montar: montar, olvidar: olvidar };
})();

<script>

  Array.prototype.forEach.call(document.querySelectorAll('.tab'), function(b){ b.setAttribute('aria-selected', String(b.dataset.v === S.tab)); });
  var pl = document.querySelector('.grafico .plot'); if (pl) pl.scrollLeft = pl.scrollWidth;
  var cont = document.querySelector('.tabs-in'), tsel = document.querySelector('.tab[aria-selected="true"]');       // en pantallas estrechas, la pestaña activa queda a la vista
  if (cont && tsel) cont.scrollLeft = Math.max(0, tsel.offsetLeft - (cont.clientWidth - tsel.offsetWidth) / 2);
}
function armarMarco(){
  var m = S.m, ult = T.ultimaFecha(m);
  app.innerHTML = '<header class="cab"><div class="cab-in">' + MARCA + '' +
    '<div class="cab-txt"><b>Ventas · panel de socios</b><small>' + (ult ? 'Datos hasta el ' + T.fmtFechaLarga(ult) : 'Sin datos todavía') + ' · <button type="button" class="enlace" data-act="salir">Salir</button></small></div></div></header>' +
    '<nav class="tabs" aria-label="Secciones"><div class="tabs-in" role="tablist">' + [['resumen', 'Resumen'], ['evolucion', 'Evolución'], ['productos', 'Productos'], ['servicio', 'Comensales'], ['simulaciones', 'Simulaciones'], ['caja', 'Cierre de caja'], ['cuadre', 'Cuadre de caja'], ['datos', 'Datos']].map(function(t){
      return '<button type="button" role="tab" class="tab" data-act="tab" data-v="' + t[0] + '" aria-selected="' + (S.tab === t[0]) + '">' + t[1] + '</button>'; }).join('') + '</div></nav><main class="pag" id="pag"></main>';
  pintarPag();
}
function pintarCarga(){
  app.innerHTML = '<header class="cab"><div class="cab-in">' + MARCA + '</div></header>' +
    '<div class="carga" role="status"><b>Cargando ventas…</b><div class="tira"><i style="width:' + Math.max(6, S.progreso[0] / S.progreso[1] * 100) + '%"></i></div></div>';
}
function pintarError(){
  app.innerHTML = '<header class="cab"><div class="cab-in">' + MARCA + '</div></header>' +
    '<main class="pag"><div class="aviso err"><b>No se han podido cargar las ventas.</b><br>' + esc(S.error) + '</div><button type="button" class="btn" data-act="reintentar">Reintentar</button></main>';
}
function scrollArriba(){ window.scrollTo(0, 0); }
/* La pestaña Servicio puede llegar hasta el último día con servicio aunque aún no haya ventas de ese día: usa un modelo con esas fechas añadidas (S.mS). El resto de pestañas usan solo los días con ventas (S.mV). */
function modeloServicio(mV, sv){
  var set = {}; mV.fechas.forEach(function(f){ set[f] = 1; });
  sv.fechas.forEach(function(f){ var d = sv.dias[f]; if (d && d.t > 0) set[f] = 1; });
  return Object.assign({}, mV, { fechas: Object.keys(set).sort() });
}
function entrarServicio(){
  if (!S.mS) return;
  var uV = T.ultimaFecha(S.mV), uS = T.ultimaFecha(S.mS); S.m = S.mS;
  if (uV && uS && uS > uV){
    if (S.anchor === uV) S.anchor = uS;
    if (S.rango && S.rango.hasta === uV){ var len = T.isoNum(S.rango.hasta) - T.isoNum(S.rango.desde); S.rango = { desde: T.sumarDias(uS, -len), hasta: uS }; }
  }
}
function salirServicio(){
  if (!S.mV) return;
  S.m = S.mV; var uV = T.ultimaFecha(S.mV), prim = T.primeraFecha(S.mV);
  if (!uV) return;
  if (S.anchor > uV) S.anchor = uV;
  if (S.rango && S.rango.hasta > uV){ var len = T.isoNum(S.rango.hasta) - T.isoNum(S.rango.desde), d = T.sumarDias(uV, -len); S.rango = { desde: d < prim ? prim : d, hasta: uV }; }
}
function irTab(v){
  if (v === 'servicio' && S.tab !== 'servicio') entrarServicio();
  else if (v !== 'servicio' && S.tab === 'servicio') salirServicio();
  S.tab = v;
}
function actuar(act, v, k){
  var antes = window.pageYOffset;
  switch (act){
    case 'tab': irTab(v); pintarPag(); scrollArriba(); return;
    case 'modo':
      if (v === 'dia') S.anchor = snapDia(S.anchor);
      S.modo = v; break;
    case 'nav': navegar(+v); break;
    case 'metrica': S.metrica = v; break;
    case 'lista': S.listaMovil = v; break;
    case 'evo-vent': S.evo.vent = v === 'todo' ? 'todo' : +v; S.evo.sel = null; S.evo.todos = false; break;
    case 'evo-met': S.evo.met = v; break;
    case 'evo-desg': S.evo.desg = v; break;
    case 'evo-todos': S.evo.todos = true; break;
    case 'evo-sel': S.evo.sel = +v; refrescarLecturaDia(); return;
    case 'srv-sel': S.srv.sel = +v; refrescarLecturaServicio(); return;
    case 'srv-todos': S.srv.todos = true; break;
    case 'ir-dia': irTab('resumen'); S.modo = 'dia'; S.anchor = v; pintarPag(); scrollArriba(); return;
    case 'ver-prov-evo': S.evo.desg = 'prov'; irTab('evolucion'); pintarPag(); scrollArriba(); return;
    case 'prod-cat': S.prod.cat = v; S.prod.sub = 'Todas'; break;
    case 'prod-sub': S.prod.sub = v; break;
    case 'prod-orden': S.prod.orden = v; break;
    case 'reintentar': iniciar(); return;
    case 'entrar': entrar(); return;
    case 'caja-acceso': window.CAJA.acceso(app); return;
    case 'salir': limpiarSes(); if (window.CUADRE) window.CUADRE.olvidar(); S.m = null; S.mV = null; S.mS = null; S.tab = 'resumen'; S.sim = { vent: 90, q: '', items: [], perd: 10, hist: {}, dias: [true, true, true, true, true, true, true], ayuda: true }; pintarAcceso(); return;
    default: if (act.indexOf('sim-') === 0 && simAccion(act, v, k) !== false) break; return;
  }
  pintarPag(); window.scrollTo(0, antes);
}
function refrescarLecturaDia(){
  var m = S.m, e = S.evo, ult = T.ultimaFecha(m), prim = T.primeraFecha(m);
  var desde = e.vent === 'todo' ? prim : T.sumarDias(ult, -(e.vent - 1)); if (desde < prim) desde = prim;
  var serie = T.serieDiaria(m, desde, ult), segs = segmentos(serie);
  var l = document.getElementById('lect-dia'); if (l) l.innerHTML = lecturaDia(serie, segs, e.sel);
  Array.prototype.forEach.call(document.querySelectorAll('.col'), function(b, i){ b.setAttribute('aria-pressed', String(i === e.sel)); });
}
document.addEventListener('click', function(ev){
  var b = ev.target.closest ? ev.target.closest('[data-act]') : null;
  if (b && !b.disabled) actuar(b.dataset.act, b.dataset.v, b.dataset.k);
});
document.addEventListener('change', function(ev){
  var t = ev.target, f = t.dataset && t.dataset.f; if (!f) return;
  if (f.indexOf('sim-') === 0){ simCambio(t, f); return; }
  if (f === 'periodo'){ S.anchor = t.value; }
  else if (f === 'desde' || f === 'hasta'){
    var r = { desde: S.rango.desde, hasta: S.rango.hasta }; if (T.esIso(t.value)) r[f] = t.value; S.rango = r;
  } else return;
  var y = window.pageYOffset; pintarPag(); window.scrollTo(0, y);
});
document.addEventListener('input', function(ev){
  var t = ev.target;
  if (t.dataset && t.dataset.f === 'q'){ S.prod.q = t.value; repintarListaProductos(); }
  else if (t.dataset && t.dataset.f === 'sim-q'){ S.sim.q = t.value; var bz = document.getElementById('sim-busca'); if (bz) bz.innerHTML = simBuscadorSeguro(T.agregar(simModelo(), simVentana())); }
  else if (t.dataset && t.dataset.f === 'sim-perd'){ S.sim.perd = +t.value; simRepintarResultados(); }
});

var SES = 'trattoria_socio_v1';       // solo se guarda el permiso firmado; nunca la contraseña
function getSes(){ try { var s = JSON.parse(localStorage.getItem(SES) || 'null'); return s && s.token ? s : null; } catch (e){ return null; } }
function setSes(s){ try { localStorage.setItem(SES, JSON.stringify(s)); } catch (e){} }
function limpiarSes(){ try { localStorage.removeItem(SES); } catch (e){} }
function pintarAcceso(error){
  app.innerHTML = '<header class="cab"><div class="cab-in">' + MARCA + '<div class="cab-txt"><b>Ventas · panel de socios</b><small>Acceso con la contraseña de los socios</small></div></div></header>' +
    '<main class="pag"><section class="bloque acceso"><h2>Entra con la contraseña</h2><p class="sub-txt">Es la contraseña de los socios que te ha dado Jorge. Solo hay que escribirla una vez en cada dispositivo.</p>' +
    (error ? '<div class="aviso err" role="alert">' + esc(error) + '</div>' : '') + '<label for="cod">Contraseña</label>' +
    '<input class="campo" id="cod" type="password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" maxlength="64" placeholder="Contraseña">' +
    '<label class="chk" style="margin-top:10px"><input type="checkbox" id="ver-clave"><span>Mostrar la contraseña</span></label>' +
    '<p style="margin-top:14px"><button type="button" class="btn" data-act="entrar">Entrar</button></p>' +
    '<div class="cj-caja-enl"><b>¿Eres encargado de sala?</b><p class="sub-txt" style="margin:4px 0 10px">Para hacer el cierre de caja entra con tu nombre y tu código. No hace falta la contraseña de los socios.</p><button type="button" class="btn claro" data-act="caja-acceso">Hacer el cierre de caja</button></div></section></main>';
  var c = document.getElementById('cod'), ver = document.getElementById('ver-clave');
  if (ver) ver.addEventListener('change', function(){ c.type = ver.checked ? 'text' : 'password'; });
  if (c){ c.addEventListener('keydown', function(e){ if (e.key === 'Enter') entrar(); }); c.focus(); }
}
async function entrar(){
  var cod = ((document.getElementById('cod') || {}).value || '').trim();
  if (!cod) return pintarAcceso('Escribe la contraseña.');
  S.cargando = true; pintarCarga();
  try {
    var r = await API.accion('socio', { clave: cod });
    setSes({ nombre: r.nombre, token: r.token, exp: r.expira }); iniciar();
  } catch (e){ S.cargando = false; pintarAcceso(e.message); }
}
async function iniciar(){
  var ses = getSes();
  if (!ses){ if (window.CAJA && window.CAJA.sesion()) return window.CAJA.soloCaja(app); return pintarAcceso(); }
  S.cargando = true; S.error = null; pintarCarga();
  try {
    S.progreso = [1, 4]; pintarCarga();
    var d = await API.ventas(ses.token);
    S.m = T.crearModelo(d.shards, d.clasif); S.estado = d.estado || null; S.ses = ses;
    S.svInfo = null; S.sv = T.crearServicio(comensalesDe(S.m)); S.srv = { sel: null, todos: false, clave: '', serie: [] }; S.sim.hist = {};
    S.mV = S.m; S.mS = modeloServicio(S.mV, S.sv); if (S.tab === 'servicio') S.m = S.mS;
    var ult = T.ultimaFecha(S.m);
    S.anchor = ult;
    if (ult){ var prim = T.primeraFecha(S.m), ini = T.sumarDias(ult, -29); S.rango = { desde: ini < prim ? prim : ini, hasta: ult }; }
    else S.rango = { desde: '2000-01-01', hasta: '2000-01-01' };
    S.cargando = false; armarMarco();
  } catch (e){
    S.cargando = false;
    if (e && e.codigo === 'SESION'){ limpiarSes(); return pintarAcceso(e.message); }
    S.error = e && e.message ? e.message : String(e); pintarError();
  }
}
window.__viewer = { S: S, iniciar: iniciar, bonito: bonito };
iniciar();
})();
