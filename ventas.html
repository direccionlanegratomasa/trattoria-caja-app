:root{
  --amarillo:#FFFFFF;        /* amarillo corporativo */
  --amarillo-claro:#EFEFEF;
  --amarillo-borde:#BDBDBD;
  --tinta:#111111;           /* negro del logotipo */
  --papel:#F4F4F4;
  --blanco:#FFFFFF;
  --linea:#D6D6D6;
  --pista:#E6E6E6;
  --suave:#5F5F5F;
  --ambar:#C98F00;
  --ladrillo:#B23A2E;
  --oliva:#6E7A3A;
  --piedra:#A39D87;
  --sube:#17623F; --sube-bg:#D9F2E5;
  --baja:#8E2A21; --baja-bg:#F8DCD8;
  --sans:'Space Grotesk', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
}
*{ box-sizing:border-box; }
html{ -webkit-text-size-adjust:100%; }
body{ margin:0; background:var(--papel); color:var(--tinta); font-family:var(--sans); font-size:16px; line-height:1.45; font-variant-numeric:tabular-nums; }
button, select, input{ font-family:inherit; font-size:inherit; color:inherit; }
button{ cursor:pointer; }
:focus-visible{ outline:3px solid var(--tinta); outline-offset:2px; }
.oscuro :focus-visible, .tabs :focus-visible{ outline-color:var(--amarillo); }
.oculto{ display:none !important; }
.solo-lector{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }

/* ---------- Cabecera de marca ---------- */
.cab{ background:var(--tinta); color:#FFFFFF; border-bottom:4px solid #FFFFFF; }
.cab-in{ max-width:1100px; margin:0 auto; padding:14px 18px; display:flex; align-items:center; justify-content:space-between; gap:10px 24px; flex-wrap:wrap; }
.marca{ display:flex; align-items:center; gap:12px; }
.marca .ico{ height:62px; width:auto; display:block; }
.marca .pal{ height:54px; width:auto; display:block; }
.rotulo{ display:block; font-weight:700; font-size:30px; line-height:1; letter-spacing:-.02em; }
.rotulo small{ display:block; margin-top:4px; font-size:13px; font-weight:500; letter-spacing:.14em; text-transform:uppercase; color:#C8C8C8; }
@media (max-width:620px){ .rotulo{ font-size:25px; } }
.cab-txt{ text-align:right; line-height:1.2; }
.cab-txt b{ display:block; font-size:20px; font-weight:700; letter-spacing:-.01em; }
.cab-txt small{ display:block; margin-top:3px; font-size:13px; color:#C8C8C8; }
@media (max-width:620px){ .marca .ico{ height:50px; } .marca .pal{ height:44px; } .cab-in{ padding:12px 16px; } .cab-txt{ text-align:left; width:100%; } .cab-txt b{ font-size:18px; } .cab-txt small{ margin-top:2px; } }

/* ---------- Pestañas ---------- */
.tabs{ background:var(--tinta); position:sticky; top:0; z-index:30; }
.tabs-in{ max-width:1100px; margin:0 auto; padding:0 6px; display:flex; gap:0; overflow-x:auto; scrollbar-width:none; }
.tabs-in::-webkit-scrollbar{ display:none; }
.tab{ flex:1 1 auto; background:none; border:0; color:#E6E6E6; padding:14px 8px 12px; font-weight:500; font-size:15px; border-bottom:4px solid transparent; white-space:nowrap; text-align:center; }
.tab[aria-selected="true"]{ color:var(--amarillo); border-bottom-color:var(--amarillo); font-weight:700; }
.tab:hover{ color:#fff; }

/* ---------- Página ---------- */
.pag{ max-width:1100px; margin:0 auto; padding:18px 18px 56px; }
.vacio{ background:var(--blanco); border:2px dashed var(--linea); border-radius:10px; padding:28px 20px; text-align:center; color:var(--suave); }
.vacio b{ display:block; color:var(--tinta); font-size:18px; margin-bottom:4px; }
.aviso{ border-radius:10px; padding:11px 14px; font-size:14.5px; border:1.5px solid; margin:12px 0; }
.aviso.err{ background:var(--baja-bg); border-color:#E0A39B; color:var(--baja); }
.aviso.warn{ background:var(--amarillo-claro); border-color:var(--amarillo-borde); color:#111111; }
.aviso.ok{ background:var(--sube-bg); border-color:#9DC7B4; color:var(--sube); }
.aviso.info{ background:#F1F0EA; border-color:var(--linea); color:var(--tinta); }

/* ---------- Controles ---------- */
.seg{ display:inline-flex; border:2px solid var(--tinta); border-radius:10px; overflow:hidden; background:var(--blanco); max-width:100%; }
.seg button{ background:none; border:0; padding:9px 14px; font-weight:500; white-space:nowrap; border-right:2px solid var(--tinta); min-height:40px; }
.seg button:last-child{ border-right:0; }
.seg button[aria-pressed="true"]{ background:var(--tinta); color:var(--amarillo); font-weight:700; }
.seg button:hover:not([aria-pressed="true"]){ background:var(--amarillo-claro); }
@media (max-width:420px){ .seg button{ padding:9px 10px; } }
.seg.scroll{ overflow-x:auto; scrollbar-width:none; }
.seg.scroll::-webkit-scrollbar{ display:none; }
.btn{ font-weight:700; border-radius:10px; padding:12px 20px; border:2px solid var(--tinta); background:var(--tinta); color:var(--amarillo); min-height:44px; }
.btn:hover:not(:disabled){ background:#000; box-shadow:0 0 0 3px rgba(255,212,0,.6); }
.btn:disabled{ opacity:.4; cursor:not-allowed; }
.btn.claro{ background:var(--blanco); color:var(--tinta); }
.btn.claro:hover:not(:disabled){ background:var(--amarillo-claro); }
.btn.peligro{ background:var(--blanco); color:var(--baja); border-color:var(--baja); }
.sel, .campo{ width:100%; border:2px solid var(--tinta); border-radius:10px; background:var(--blanco); padding:9px 12px; min-height:44px; font-weight:500; }
.sel{ appearance:none; -webkit-appearance:none; padding-right:36px;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%231C1A12' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'></polyline></svg>");
  background-repeat:no-repeat; background-position:right 12px center; }
.flecha{ width:44px; min-width:44px; height:44px; border:2px solid var(--tinta); border-radius:10px; background:var(--blanco); display:inline-flex; align-items:center; justify-content:center; padding:0; }
.flecha:hover:not(:disabled){ background:var(--amarillo-claro); }
.flecha:disabled{ opacity:.3; cursor:not-allowed; }
.flecha svg{ width:16px; height:16px; stroke:var(--tinta); stroke-width:3; fill:none; stroke-linecap:round; stroke-linejoin:round; }

/* ---------- Variación (sube / baja) ---------- */
.delta{ display:inline-flex; align-items:center; gap:5px; border-radius:999px; padding:3px 10px; font-weight:700; font-size:14px; line-height:1.3; white-space:nowrap; }
.delta svg{ width:10px; height:10px; fill:currentColor; }
.delta.sube{ background:var(--sube-bg); color:var(--sube); }
.delta.baja{ background:var(--baja-bg); color:var(--baja); }
.delta.igual{ background:#ECE7D8; color:var(--tinta); }

/* ---------- Bloques (comunes) ---------- */
.bloque{ border-top:4px solid var(--tinta); padding-top:14px; min-width:0; }
.bloque > h2, .bloque-cab h2{ margin:0 0 14px; font-size:22px; font-weight:700; letter-spacing:-.015em; }
.bloque-cab{ display:flex; align-items:center; justify-content:space-between; gap:10px 16px; flex-wrap:wrap; margin-bottom:14px; }
.bloque-cab h2{ margin:0; }
.sub-txt{ color:var(--suave); font-size:14px; margin:-6px 0 14px; }
.pag > .bloque{ margin-bottom:34px; }
.notas{ padding-left:20px; margin:0; } .notas li{ margin-bottom:8px; }
.contador{ color:var(--suave); font-size:14px; margin:0 0 8px; }

/* ---------- Acceso con código ---------- */
.acceso{ max-width:460px; }
.acceso label{ font-weight:500; font-size:14px; display:block; margin-bottom:4px; }
.enlace{ background:none; border:0; padding:0; text-decoration:underline; font-weight:700; color:inherit; cursor:pointer; font-size:inherit; }

.rejilla{ display:grid; gap:34px 40px; }
@media (min-width:960px){ .rejilla.dos{ grid-template-columns:1fr 1fr; align-items:start; } }
/* ---------- Selector de periodo ---------- */
.periodo{ display:flex; flex-direction:column; gap:12px; margin-bottom:26px; }
.periodo .fila{ display:flex; gap:8px; align-items:center; }
.periodo .fila.centro{ justify-content:flex-start; }
.periodo .rangos{ display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:10px; }
.periodo .rangos > div{ min-width:0; }
.periodo input[type=date]{ min-width:0; }
.rango-caja{ display:flex; flex-direction:column; gap:10px; width:100%; }
.btn.peq{ padding:7px 14px; min-height:38px; font-size:14px; }
.periodo label{ font-size:13px; color:var(--suave); display:block; margin-bottom:4px; font-weight:500; }
@media (min-width:700px){ .periodo{ flex-direction:row; align-items:center; justify-content:space-between; } .periodo .fila.nav{ flex:0 1 480px; } .rango-caja{ flex:0 1 480px; width:auto; } }

/* ---------- Ticket de ventas ---------- */
.ticket{ position:relative; background:var(--tinta); color:#fff; padding:22px 20px 30px; margin-bottom:46px; border-radius:6px 6px 0 0; }
.ticket::after{ content:""; position:absolute; left:0; right:0; bottom:-14px; height:14px;
  background:linear-gradient(135deg, var(--tinta) 7px, transparent 0) 0 0/16px 14px repeat-x, linear-gradient(225deg, var(--tinta) 7px, transparent 0) 0 0/16px 14px repeat-x; }
.ticket .et{ font-size:16px; font-weight:500; color:#EDEDED; margin:0; }
.ticket .sub{ font-size:14px; color:#BDB69F; margin:2px 0 0; }
.ticket .cifra{ font-size:clamp(30px, min(13.5vw, calc((100vw - 76px) / (var(--n, 10) * .6))), 92px); line-height:1; font-weight:700; letter-spacing:-.035em; color:var(--amarillo); margin:14px 0 12px; white-space:nowrap; }
.ticket .var{ display:flex; align-items:center; flex-wrap:wrap; gap:6px 10px; font-size:14px; color:#E6E6E6; }
.ticket .var:empty{ display:none; }
.ticket .cifra{ margin-bottom:14px; }
.ticket .datos{ display:grid; grid-template-columns:1fr 1fr; gap:16px 14px; margin:22px 0 0; padding:18px 0 0; border-top:2px dashed #6A6A6A; }
.ticket .dato{ min-width:0; }
.ticket .dato small{ display:block; font-size:14px; color:#CFCFCF; }
.ticket .dato b{ display:block; font-size:26px; font-weight:700; line-height:1.15; color:#fff; }
.ticket .dato .d{ font-size:13px; font-weight:700; margin-top:2px; }
.ticket .dato .d.sube{ color:#7EE0AB; } .ticket .dato .d.baja{ color:#FFA79E; } .ticket .dato .d.igual{ color:#CFCFCF; }
.ticket .nota{ margin:16px 0 0; font-size:14px; color:#D0D0D0; }
@media (min-width:760px){ .ticket{ padding:28px 34px 36px; } .ticket .dato b{ font-size:28px; } }
@media (min-width:980px){
  .ticket{ display:grid; grid-template-columns:minmax(0,1fr) 400px; grid-template-areas:'et datos' 'sub datos' 'cifra datos' 'var datos' 'nota datos'; column-gap:40px; align-content:start; }
  .ticket .et{ grid-area:et; } .ticket .sub{ grid-area:sub; } .ticket .cifra{ grid-area:cifra; font-size:clamp(40px, calc((min(100vw, 1100px) - 544px) / (var(--n, 10) * .6)), 96px); margin-top:18px; } .ticket .var{ grid-area:var; } .ticket .nota{ grid-area:nota; }

function nombreMes(iso){ var p = iso.split('-'); var m = MESES[+p[1] - 1]; return m.charAt(0).toUpperCase() + m.slice(1) + ' ' + p[0]; }
function etiquetaSemana(lunes){
  var dom = sumarDias(lunes, 6), a = lunes.split('-'), b = dom.split('-');
  return 'Semana del ' + (+a[2]) + ' ' + MESES_C[+a[1] - 1] + (a[0] !== b[0] ? ' ' + a[0] : '') + ' al ' + (+b[2]) + ' ' + MESES_C[+b[1] - 1] + ' ' + b[0];
}

/* ---------- Modelo ---------- */
function normalizarClasif(raw){
  var c = { orden: [], productos: {} };
  if (raw && typeof raw === 'object'){
    if (Array.isArray(raw.orden)) c.orden = raw.orden.slice();
    if (raw.productos && typeof raw.productos === 'object') c.productos = raw.productos;
  }
  if (!c.orden.length) c.orden = CFG.categoriasBase.slice();
  Object.keys(c.productos).forEach(function(k){ var cat = c.productos[k].c; if (cat && c.orden.indexOf(cat) < 0) c.orden.push(cat); });
  return c;
}
function prepararDia(fecha, d, clase){
  var nC = d.centros.length, filas = [], tot = { u: 0, c: 0 }, ex = { u: 0, c: 0 }, mus = { u: 0, c: 0 }, porCentro = d.centros.map(function(){ return { u: 0, c: 0 }; });
  (d.filas || []).forEach(function(r){
    var u = [], c = [], k = claveProducto(r[0]), cl = clase(k);
    for (var i = 0; i < nC; i++){
      var uu = +r[1 + 2 * i] || 0, cc = Math.round((+r[2 + 2 * i] || 0) * 100);
      u.push(uu); c.push(cc);
      if (cl === 'ex'){ ex.u += uu; ex.c += cc; }
      else if (cl === 'mus'){ mus.u += uu; mus.c += cc; }
      else { porCentro[i].u += uu; porCentro[i].c += cc; tot.u += uu; tot.c += cc; }
    }
    filas.push({ k: k, n: limpiarNombre(r[0]), u: u, c: c, ex: cl !== null, mus: cl === 'mus' });
  });
  return { fecha: fecha, centros: d.centros.slice(), comensales: Array.isArray(d.comensales) && d.comensales.length === nC ? d.comensales.map(function(x){ return +x || 0; }) : null, tickets: Array.isArray(d.tickets) && d.tickets.length === nC ? d.tickets.map(function(x){ return +x || 0; }) : null, filas: filas, tot: tot, excl: ex, mus: mus, porCentro: porCentro, archivo: d.archivo || '', cargado: d.cargado || '' };
}
function crearModelo(shards, clasifRaw){
  var clasif = normalizarClasif(clasifRaw), dias = {}, centros = [];
  var clase = function(k){ var p = clasif.productos[k]; return p && p.c === CFG.excluido ? 'ex' : (p && p.c === CFG.musicos ? 'mus' : null); };
  (shards || []).forEach(function(sh){
    var dd = (sh && sh.dias) || (sh && sh.datos && sh.datos.dias) || {};
    Object.keys(dd).forEach(function(f){ if (esIso(f) && dd[f] && Array.isArray(dd[f].centros)) dias[f] = prepararDia(f, dd[f], clase); });
  });
  var fechas = Object.keys(dias).sort();
  fechas.forEach(function(f){ dias[f].centros.forEach(function(c){ if (centros.indexOf(c) < 0) centros.push(c); }); });
  var cats = clasif.orden.filter(function(x){ return x !== CFG.excluido && x !== CFG.musicos; }); if (cats.indexOf(CFG.sinClasificar) < 0) cats.push(CFG.sinClasificar);
  var exU = 0, exC = 0, muU = 0, muC = 0; fechas.forEach(function(f){ exU += dias[f].excl.u; exC += dias[f].excl.c; muU += dias[f].mus.u; muC += dias[f].mus.c; });
  return { dias: dias, fechas: fechas, centros: centros, clasif: clasif, categorias: cats, excluidos: { u: exU, c: exC }, musicos: { u: muU, c: muC } };
}
function catDe(m, k){ var p = m.clasif.productos[k]; return p && p.c ? p.c : CFG.sinClasificar; }
function subDe(m, k){ var p = m.clasif.productos[k]; return p && p.s ? p.s : null; }

/* ---------- Agregación ---------- */
function agregar(m, fechas){
  var a = { fechas: fechas.filter(function(f){ return m.dias[f]; }), u: 0, c: 0, centros: {}, cats: {}, prods: {}, musicos: { u: 0, c: 0, prods: {} } };
  m.centros.forEach(function(c){ a.centros[c] = { u: 0, c: 0 }; });
  m.categorias.forEach(function(c){ a.cats[c] = { u: 0, c: 0 }; });
  a.fechas.forEach(function(f){
    var d = m.dias[f];
    d.filas.forEach(function(r){
      if (r.ex){
        if (r.mus){
          var mp = a.musicos.prods[r.k] || (a.musicos.prods[r.k] = { k: r.k, n: (m.clasif.productos[r.k] && m.clasif.productos[r.k].n) || r.n, u: 0, c: 0, centros: {} });
          for (var j = 0; j < d.centros.length; j++){ mp.u += r.u[j]; mp.c += r.c[j]; a.musicos.u += r.u[j]; a.musicos.c += r.c[j]; mp.centros[d.centros[j]] = (mp.centros[d.centros[j]] || 0) + r.u[j]; }
        }
        return;
      }
      var cat = catDe(m, r.k), p = a.prods[r.k];
      if (!p){ var def = m.clasif.productos[r.k]; p = a.prods[r.k] = { k: r.k, n: def && def.n ? def.n : r.n, cat: cat, sub: subDe(m, r.k), prov: def && def.v ? def.v : null, u: 0, c: 0, centros: {} }; }
      for (var i = 0; i < d.centros.length; i++){
        var cn = d.centros[i];
        p.u += r.u[i]; p.c += r.c[i];
        a.u += r.u[i]; a.c += r.c[i];
        a.centros[cn].u += r.u[i]; a.centros[cn].c += r.c[i];
        if (!a.cats[cat]) a.cats[cat] = { u: 0, c: 0 };
        a.cats[cat].u += r.u[i]; a.cats[cat].c += r.c[i];
        if (!p.centros[cn]) p.centros[cn] = { u: 0, c: 0 };
        p.centros[cn].u += r.u[i]; p.centros[cn].c += r.c[i];
      }
    });
  });
  return a;
}
/* Orden de los rankings: por unidades (o ventas), desempate por la otra magnitud y luego por nombre. */
function ordenar(lista, metrica){
  return lista.slice().sort(function(x, y){
    var p = metrica === 'c' ? (y.c - x.c) || (y.u - x.u) : (y.u - x.u) || (y.c - x.c);
    return p || cmpTexto(x.n, y.n);
  });
}
function ranking(a, categoria, metrica){
  var l = []; Object.keys(a.prods).forEach(function(k){ var p = a.prods[k]; if (!categoria || p.cat === categoria) l.push(p); });
  return ordenar(l, metrica || 'u');
}
function lista(obj, metrica){ return Object.keys(obj).map(function(k){ return { n: k, u: obj[k].u, c: obj[k].c }; }); }

/* Entradas agrupadas por proveedor (y dentro de cada uno, por tipo). Orden: ventas y luego unidades. */
function entradasPorProveedor(a){
  var provs = {}, tot = { u: 0, c: 0 };
  Object.keys(a.prods).forEach(function(k){
    var p = a.prods[k]; if (p.cat !== CFG.entradas) return;
    var nombre = p.prov || CFG.sinProveedor, o = provs[nombre] || (provs[nombre] = { n: nombre, u: 0, c: 0, tipos: {}, prods: [] });
    o.u += p.u; o.c += p.c; tot.u += p.u; tot.c += p.c; o.prods.push(p);
    var t = p.sub || 'Otras', x = o.tipos[t] || (o.tipos[t] = { n: t, u: 0, c: 0 }); x.u += p.u; x.c += p.c;
  });
  var lista = Object.keys(provs).map(function(k){ var o = provs[k]; o.tipos = Object.keys(o.tipos).map(function(t){ return o.tipos[t]; }).sort(function(x, y){ return (y.c - x.c) || (y.u - x.u) || cmpTexto(x.n, y.n); }); o.prods = ordenar(o.prods, 'c'); return o; })
    .sort(function(x, y){ return (y.c - x.c) || (y.u - x.u) || cmpTexto(x.n, y.n); });
  return { total: tot, lista: lista };
}
function listaMusicos(a){ return ordenar(Object.keys(a.musicos.prods).map(function(k){ return a.musicos.prods[k]; }), 'u'); }
function proveedoresConocidos(m){
  var out = []; Object.keys(m.clasif.productos).forEach(function(k){ var p = m.clasif.productos[k]; if (p.c === CFG.entradas && p.v && out.indexOf(p.v) < 0) out.push(p.v); });
  return out.sort(cmpTexto);
}

/* ---------- Periodos ---------- */
function ultimaFecha(m){ return m.fechas.length ? m.fechas[m.fechas.length - 1] : null; }
function primeraFecha(m){ return m.fechas.length ? m.fechas[0] : null; }
function cargados(m, desde, hasta){ return m.fechas.filter(function(f){ return f >= desde && f <= hasta; }); }

/* per = { modo: 'dia'|'semana'|'mes'|'todo'|'rango', ref, desde, hasta } */
function resolverPeriodo(m, per){
  var ult = ultimaFecha(m), prim = primeraFecha(m), desde, hasta, etiqueta, sust, pasado;
  if (!ult) return { modo: per.modo, vacio: true, fechas: [], etiqueta: '', sust: 'periodo' };
  switch (per.modo){
    case 'dia':    desde = hasta = per.ref; etiqueta = fmtFechaLarga(per.ref); sust = 'día'; break;
    case 'semana': desde = lunesDe(per.ref); hasta = sumarDias(desde, 6); etiqueta = etiquetaSemana(desde); sust = 'semana'; break;
    case 'mes':    desde = inicioMes(per.ref); hasta = finMes(per.ref); etiqueta = nombreMes(per.ref); sust = 'mes'; break;
    case 'rango':  desde = per.desde; hasta = per.hasta; if (desde > hasta){ var t = desde; desde = hasta; hasta = t; }
                   etiqueta = fmtFecha(desde) + ' – ' + fmtFecha(hasta); sust = 'periodo'; break;
    default:       desde = prim; hasta = ult; etiqueta = 'Todo el histórico'; sust = 'periodo';
  }
  var hastaEf = hasta > ult ? ult : hasta;          // un periodo en curso se mide "hasta hoy"
  var enCurso = hasta > ult;
  var fechas = cargados(m, desde, hastaEf);
  var nEsp = hastaEf >= desde ? isoNum(hastaEf) - isoNum(desde) + 1 : 0;
  return { modo: per.modo, desde: desde, hasta: hasta, hastaEf: hastaEf, enCurso: enCurso, fechas: fechas, nEsperados: nEsp,
           etiqueta: etiqueta, sust: sust, faltan: Math.max(0, nEsp - fechas.length) };
}
/* Periodo con el que se compara: mismo día de la semana anterior · semana anterior · mes anterior · tramo anterior de igual duración. */
function periodoComparable(m, p){
  if (p.vacio || p.modo === 'todo' || !p.fechas.length) return null;
  var desde, hasta, etiqueta;
  if (p.modo === 'dia'){ desde = hasta = sumarDias(p.desde, -7); etiqueta = 'el ' + fmtFechaLarga(desde); }
  else if (p.modo === 'semana'){ desde = sumarDias(p.desde, -7); hasta = sumarDias(p.hastaEf, -7); etiqueta = 'la semana anterior'; }
  else if (p.modo === 'mes'){
    desde = mesAnterior(p.desde);
    var finPrev = finMes(desde);
    if (p.hastaEf === finMes(p.desde)) hasta = finPrev;
    else { var dd = +p.hastaEf.slice(8); hasta = desde.slice(0, 8) + pad(dd); if (hasta > finPrev) hasta = finPrev; }
    etiqueta = 'el mes anterior';
  } else {                                           // rango
    var len = isoNum(p.hastaEf) - isoNum(p.desde) + 1;
    desde = sumarDias(p.desde, -len); hasta = sumarDias(p.desde, -1); etiqueta = 'el tramo anterior (' + len + ' días)';
  }
  var fechas = cargados(m, desde, hasta), nEsp = isoNum(hasta) - isoNum(desde) + 1;
  return { desde: desde, hasta: hasta, fechas: fechas, nEsperados: nEsp, completo: fechas.length === nEsp, etiqueta: etiqueta };
}

/* ---------- Evolución ---------- */
function serieDiaria(m, desde, hasta){
  return rango(desde, hasta).map(function(f){
    var d = m.dias[f];
    if (!d) return { fecha: f, tiene: false, u: 0, c: 0, centros: {}, centrosU: {}, cats: {}, catsU: {}, prov: {}, provU: {} };
    var s = { fecha: f, tiene: true, u: d.tot.u, c: d.tot.c, centros: {}, centrosU: {}, cats: {}, catsU: {}, prov: {}, provU: {} };
    d.centros.forEach(function(cn, i){ s.centros[cn] = d.porCentro[i].c; s.centrosU[cn] = d.porCentro[i].u; });
    d.filas.forEach(function(r){
      if (r.ex) return;
      var cat = catDe(m, r.k), tc = 0, tu = 0;
      for (var i = 0; i < r.c.length; i++){ tc += r.c[i]; tu += r.u[i]; }
      s.cats[cat] = (s.cats[cat] || 0) + tc; s.catsU[cat] = (s.catsU[cat] || 0) + tu;
      if (cat === CFG.entradas){ var df = m.clasif.productos[r.k], pv = (df && df.v) || CFG.sinProveedor; s.prov[pv] = (s.prov[pv] || 0) + tc; s.provU[pv] = (s.provU[pv] || 0) + tu; }
    });
    return s;
  });
}
function mediaPorDiaSemana(serie){
  var acc = [0, 1, 2, 3, 4, 5, 6].map(function(){ return { n: 0, c: 0, u: 0 }; });
  serie.forEach(function(s){ if (s.tiene){ var w = acc[diaSemana(s.fecha)]; w.n++; w.c += s.c; w.u += s.u; } });
  return acc.map(function(w, i){ return { dia: DIAS_L[i], corto: DIAS_C[i], n: w.n, c: w.n ? w.c / w.n : 0, u: w.n ? w.u / w.n : 0 }; });
}

/* ============================================================
   SERVICIO: comensales (comidas y cenas) y última llamada, de los datos de operaciones.
   Regla: si una fecha tiene varios registros, vale el ÚLTIMO de la lista.
   ============================================================ */
/* Minutos de la hora «HH:MM». La madrugada (00:00–05:59) cuenta como la noche anterior: 00:23 → 24:23. */
function llamadaMin(l){ var p = /^(\d{1,2}):(\d{2})$/.exec(l || ''); if (!p) return null; var h = +p[1], mi = +p[2]; if (h > 23 || mi > 59) return null; return (h < 6 ? h + 24 : h) * 60 + mi; }
/* Una última llamada entre las 06:00 y las 11:59 no es creíble para un restaurante de noche (casi seguro es 12 h mal escritas): se marca y no entra en las medias. */
function llamadaDudosa(l){ var p = /^(\d{1,2}):(\d{2})$/.exec(l || ''); if (!p) return false; var h = +p[1]; return h >= 6 && h < 12; }
function fmtLlamada(min){ if (min === null || min === undefined || isNaN(min)) return '—'; var t = Math.round(min) % 1440; return pad(Math.floor(t / 60)) + ':' + pad(t % 60); }
/* lista: [{f: 'AAAA-MM-DD', c: comidas, e: cenas, l: 'HH:MM'}] en el orden recibido */
function crearServicio(lista){
  var dias = {}, n = {};
  (lista || []).forEach(function(x){
    if (!x || !esIso(x.f)) return;
    n[x.f] = (n[x.f] || 0) + 1;
    var c = x.c > 0 ? Math.round(x.c) : 0, e = x.e > 0 ? Math.round(x.e) : 0, tt = x.t > 0 ? Math.round(x.t) : (c + e);
    var ns = (x.n === null || x.n === undefined || !isFinite(x.n)) ? null : (x.n > 0 ? Math.round(x.n) : 0);
    dias[x.f] = { f: x.f, c: c, e: e, t: tt, l: x.l || '', n: ns };           // el último registro de la fecha sustituye al anterior
  });
  var fechas = Object.keys(dias).sort();
  fechas.forEach(function(f){ var d = dias[f]; d.r = n[f]; d.dud = llamadaDudosa(d.l); d.lm = d.dud ? null : llamadaMin(d.l); });
  return { dias: dias, fechas: fechas, registros: (lista || []).length, repetidos: fechas.filter(function(f){ return dias[f].r > 1; }).length };
}
/* Resumen de [desde, hasta]. Las ventas (en céntimos) salen del modelo de ventas m. */
function servicioPeriodo(sv, m, desde, hasta){
  var r = { desde: desde, hasta: hasta, regs: 0, dias: 0, c: 0, e: 0, t: 0, diasC: 0, diasE: 0, ventas: 0, tVentas: 0, diasVentas: 0, ns: 0, diasNs: 0, llam: [], dud: 0, repetidos: 0, sinRegistro: 0, sinVentas: 0 };
  if (!(desde <= hasta)) return finServicio(r);
  rango(desde, hasta).forEach(function(f){
    var d = sv.dias[f], v = m.dias[f];
    if (!d){ if (v) r.sinRegistro++; return; }
    r.regs++; if (d.r > 1) r.repetidos++; if (d.dud) r.dud++;
    if (d.t <= 0) return;                                                    // registro sin comensales: no cuenta como día de servicio
    r.dias++; r.c += d.c; r.e += d.e; r.t += d.t; if (d.c > 0) r.diasC++; if (d.e > 0) r.diasE++;
    if (d.n !== null){ r.ns += d.n; r.diasNs++; }
    if (d.lm !== null) r.llam.push(d.lm);
    var vs = ventasSala(v);
    if (vs !== null){ r.ventas += vs; r.tVentas += d.t; r.diasVentas++; } else r.sinVentas++;
  });
  return finServicio(r);
}
/* Ventas del centro «Sala» de un día (céntimos), ya sin cupones ni músicos. null si ese día no trae el centro Sala. */
function ventasSala(v){
  if (!v || !v.centros) return null;
  var s = 0, hay = false;
  for (var i = 0; i < v.centros.length; i++) if (/^(sala|terraza)$/i.test(String(v.centros[i]).trim())){ s += v.porCentro[i].c; hay = true; }
  return hay ? s : null;
}
function finServicio(r){
  r.mediaT = r.dias ? r.t / r.dias : null; r.mediaC = r.diasC ? r.c / r.diasC : null; r.mediaE = r.diasE ? r.e / r.diasE : null;
  r.mediaNs = r.diasNs ? r.ns / r.diasNs : null;
  r.porComensal = r.tVentas ? r.ventas / r.tVentas : null;
  r.llamMedia = r.llam.length ? r.llam.reduce(function(s, x){ return s + x; }, 0) / r.llam.length : null;
  return r;
}
/* Un elemento por fecha de [desde, hasta] (también las que no tienen registro) */
function servicioSerie(sv, m, desde, hasta){
  return rango(desde, hasta).map(function(f){
    var d = sv.dias[f], v = m.dias[f], s = { fecha: f, tiene: !!d, c: 0, e: 0, t: 0, l: '', n: null, dud: false, r: 0, ventas: ventasSala(v), hayDia: !!v, porC: null };
    if (d){ s.c = d.c; s.e = d.e; s.t = d.t; s.l = d.l; s.n = d.n; s.dud = d.dud; s.r = d.r; if (s.ventas !== null && d.t > 0) s.porC = s.ventas / d.t; }
    return s;
  });
}
/* Medias por día de la semana: comensales y venta por comensal */
function servicioPorDiaSemana(serie){
  var acc = [0, 1, 2, 3, 4, 5, 6].map(function(){ return { n: 0, t: 0, c: 0, e: 0, nc: 0, ne: 0, ventas: 0, tVentas: 0 }; });
  serie.forEach(function(s){
    if (!s.tiene || s.t <= 0) return;
    var w = acc[diaSemana(s.fecha)]; w.n++; w.t += s.t; w.c += s.c; w.e += s.e; if (s.c > 0) w.nc++; if (s.e > 0) w.ne++;
    if (s.ventas !== null){ w.ventas += s.ventas; w.tVentas += s.t; }
  });
  return acc.map(function(w, i){ return { dia: DIAS_L[i], corto: DIAS_C[i], n: w.n, t: w.n ? w.t / w.n : 0, c: w.nc ? w.c / w.nc : 0, e: w.ne ? w.e / w.ne : 0, nc: w.nc, ne: w.ne, porComensal: w.tVentas ? w.ventas / w.tVentas : null }; });
}
function diasSinDatos(m){
  if (m.fechas.length < 2) return [];
  return rango(primeraFecha(m), ultimaFecha(m)).filter(function(f){ return !m.dias[f]; });
}

/* "el mes anterior" -> "frente al mes anterior"; "la semana anterior" -> "frente a la semana anterior" */
function frenteA(et){ return 'frente ' + (et.indexOf('el ') === 0 ? 'al ' + et.slice(3) : 'a ' + et); }

/* ---------- Lectura gerencial (frases generadas con reglas, sin inventar nada) ---------- */
function lectura(m, a, comp, p, nombres){
  var out = [], lid = function(cat){ var r = ranking(a, cat, 'u'); return r.length ? r[0] : null; };
  var pa = lid('Pasta y risotto'), pz = lid('Pizzas'), ca = lid('Carnes y pescados'), be = lid('Bebidas'), po = lid('Postres');
  if (pa) out.push('Pasta o risotto líder: ' + pa.n + ' (' + fmtNum(pa.u) + ' uds.)');
  if (pz) out.push('Pizza líder: ' + pz.n + ' (' + fmtNum(pz.u) + ' uds.)');
  if (ca) out.push('Carne o pescado líder: ' + ca.n + ' (' + fmtNum(ca.u) + ' uds.)');
  if (be) out.push('Bebida líder: ' + be.n + ' (' + fmtNum(be.u) + ' uds.)');
  if (po) out.push('Postre líder: ' + po.n + ' (' + fmtNum(po.u) + ' uds.)');
  var cs = lista(a.centros).filter(function(c){ return c.c > 0; }).sort(function(x, y){ return y.c - x.c; });
  if (cs.length > 1 && a.c > 0){
    var art = p.sust === 'día' || p.sust === 'mes' ? 'del' : 'de la';
    var de = p.sust === 'periodo' ? 'del periodo' : art + ' ' + p.sust;
    out.push(cs[0].n + ' concentra el ' + fmtPct(cs[0].c / a.c * 100) + ' de la facturación ' + de + '.');
  }
  if (comp && comp.completo){
    var ac = agregar(m, comp.fechas), v = pctVar(a.c, ac.c);
    if (v !== null){
      var tx = Math.abs(v) < 0.5 ? 'se mantienen estables' : (v > 0 ? 'suben un ' + fmtPct(Math.abs(v)) : 'bajan un ' + fmtPct(Math.abs(v)));
      out.push('Las ventas ' + tx + ' ' + frenteA(comp.etiqueta) + ' (' + fmtEur(ac.c) + ').');
    }

    case 'sim-limpiar': S.sim.items = []; break;
    case 'sim-sube': {
      if (!it) break; var b = T.baseProducto(T.agregar(simModelo(), simVentana()), simHist(it.k), it.k, simCal()); if (!b) break;
      var P0 = b.P0, nuevo = v.charAt(0) === 'p' ? P0 * (1 + (+v.slice(1)) / 100) : P0 + (+v.slice(1)); it.nuevo = redondeo5(nuevo); it.perd = null; break; }
    case 'sim-usar': {
      if (!it) break; if (it.perd !== null){ it.perd = null; break; }
      var b2 = T.baseProducto(T.agregar(simModelo(), simVentana()), simHist(it.k), it.k, simCal()), est = b2 && it.nuevo !== null ? T.perdidaHistorica(simHist(it.k), b2.P0, it.nuevo) : null;
      if (est !== null) it.perd = Math.round(est * 10) / 10; break; }
    default: return false;
  }
  return true;
}

/* ============================== DATOS ============================== */
function vistaDatos(){
  var m = S.m, fs = m.fechas, sin = T.diasSinDatos(m), all = T.agregar(m, fs);
  var noClas = Object.keys(all.prods).map(function(k){ return all.prods[k]; }).filter(function(p){ return p.cat === 'Sin clasificar'; });
  var ultimo = m.dias[T.ultimaFecha(m)];
  var h = '<section class="bloque"><h2>Datos cargados</h2><dl class="hechos">' +
    '<div><dt>Último día con datos</dt><dd>' + T.fmtFechaLarga(T.ultimaFecha(m)) + '</dd></div>' +
    '<div><dt>Primer día</dt><dd>' + T.fmtFechaLarga(T.primeraFecha(m)) + '</dd></div>' +
    '<div><dt>Días con datos</dt><dd>' + fs.length + '</dd></div>' +
    '<div><dt>Días sin datos</dt><dd>' + (sin.length ? sin.length + ' entre el primero y el último' + '<div class="etiquetas">' + sin.slice(0, 40).map(function(f){ return '<span>' + T.fmtFecha(f) + '</span>'; }).join('') + (sin.length > 40 ? '<span>…</span>' : '') + '</div>' : 'Ninguno') + '</dd></div>' +
    '<div><dt>Centros de venta</dt><dd>' + m.centros.map(esc).join(', ') + '</dd></div>' +
    '<div><dt>Productos distintos</dt><dd>' + T.fmtNum(Object.keys(all.prods).length) + '</dd></div>' +
    '<div><dt>Sin clasificar</dt><dd>' + (noClas.length ? noClas.length + ' ' + plural(noClas.length, 'producto', 'productos') + '<div class="etiquetas">' + noClas.slice(0, 30).map(function(p){ return '<span>' + esc(bonito(p.n)) + '</span>'; }).join('') + '</div>' : 'Ninguno') + '</dd></div>' +
    (m.excluidos.u ? '<div><dt>Cupones apartados</dt><dd>' + T.fmtNum(m.excluidos.u) + ' uds. (' + T.fmtEur(m.excluidos.c) + '): no cuentan en ninguna cifra</dd></div>' : '') +
    (m.musicos.u ? '<div><dt>Invitaciones y personal</dt><dd>' + T.fmtNum(m.musicos.u) + ' uds. en total (' + T.fmtEur(m.musicos.c) + '): se muestran aparte</dd></div>' : '') +
    (S.estado && S.estado.ultima ? '<div><dt>Última carga automática</dt><dd>' + esc(T.fmtFecha(S.estado.ultima.slice(0, 10)) + ' ' + S.estado.ultima.slice(11, 16)) + (S.estado.nuevos ? ' · ' + S.estado.nuevos + ' ' + plural(S.estado.nuevos, 'día nuevo', 'días nuevos') : ' · sin novedades') + '</dd></div>' : '') +
    (S.svInfo ? '<div><dt>Datos de servicio</dt><dd>' + (S.svInfo.error ? esc(S.svInfo.error) : (S.sv.fechas.length ? 'Del ' + T.fmtFecha(S.sv.fechas[0]) + ' al ' + T.fmtFecha(S.sv.fechas[S.sv.fechas.length - 1]) + ' · ' + S.sv.fechas.length + ' días' : 'Sin registros') + (S.svInfo.desactualizado ? ' · copia reciente' : '')) + '<br><small>Origen: registro de operaciones (comidas, cenas y última llamada)</small></dd></div>' : '') +
    '<div><dt>Origen</dt><dd>Ágora · Ventas por Productos por Centro de Venta</dd></div>' +
    (ultimo && ultimo.archivo ? '<div><dt>Último archivo</dt><dd>' + esc(ultimo.archivo) + (ultimo.cargado ? '<br><small>Cargado el ' + T.fmtFecha(ultimo.cargado.slice(0, 10)) + '</small>' : '') + '</dd></div>' : '') +
    '</dl></section>';
  h += '<section class="bloque" style="margin-top:34px"><h2>Cómo se calculan las cifras</h2><ul class="notas">' +
    '<li>Las ventas y unidades suman todos los centros de venta. Los <b>cupones no cuentan</b> en ninguna cifra, porque no tienen validez. Las <b>invitaciones y el consumo del personal</b> (categoría «Invitaciones y personal») tampoco suman: se muestran aparte en el Resumen. La fila <b>«Comensales»</b> del informe no es un producto: alimenta la pestaña Comensales.</li>' +
    '<li>Los rankings se ordenan por unidades y, a igualdad, por ventas y por nombre (o al revés si eliges «Ventas €»).</li>' +
    '<li>Las comparativas se hacen con el mismo día de la semana anterior (día), la semana anterior, el mes anterior (mismos días, si el mes está en curso) o el tramo inmediatamente anterior (rango). Solo se muestran cuando el periodo anterior tiene todos sus días cargados.</li>' +
    '<li>Cada producto pertenece a una categoría según el mapa de clasificación; si cambia, las cifras históricas se recalculan solas.</li></ul></section>';
  return h;
}

/* ============================== MARCO Y EVENTOS ============================== */
function vistaVacia(){ return '<div class="vacio"><b>Todavía no hay ventas cargadas</b>Cuando se cargue el primer día, aparecerá aquí el resumen.</div>'; }
function pintarPag(){
  var m = S.m, el = document.getElementById('pag'); if (!el) return;
  el.innerHTML = !m.fechas.length ? vistaVacia() : (S.tab === 'resumen' ? vistaResumen() : S.tab === 'evolucion' ? vistaEvolucion() : S.tab === 'productos' ? vistaProductos() : S.tab === 'entradas' ? vistaEntradas() : S.tab === 'servicio' ? vistaServicio() : S.tab === 'simulaciones' ? vistaSimulaciones() : vistaDatos());
  Array.prototype.forEach.call(document.querySelectorAll('.tab'), function(b){ b.setAttribute('aria-selected', String(b.dataset.v === S.tab)); });
  var pl = document.querySelector('.grafico .plot'); if (pl) pl.scrollLeft = pl.scrollWidth;
  var cont = document.querySelector('.tabs-in'), tsel = document.querySelector('.tab[aria-selected="true"]');       // en pantallas estrechas, la pestaña activa queda a la vista
  if (cont && tsel) cont.scrollLeft = Math.max(0, tsel.offsetLeft - (cont.clientWidth - tsel.offsetWidth) / 2);
}
function armarMarco(){
  var m = S.m, ult = T.ultimaFecha(m);
  app.innerHTML = '<header class="cab"><div class="cab-in">' + MARCA + '' +
    '<div class="cab-txt"><b>Ventas · panel de socios</b><small>' + (ult ? 'Datos hasta el ' + T.fmtFechaLarga(ult) : 'Sin datos todavía') + ' · <button type="button" class="enlace" data-act="salir">Salir</button></small></div></div></header>' +
    '<nav class="tabs" aria-label="Secciones"><div class="tabs-in" role="tablist">' + [['resumen', 'Resumen'], ['evolucion', 'Evolución'], ['productos', 'Productos'], ['servicio', 'Comensales'], ['simulaciones', 'Simulaciones'], ['datos', 'Datos']].map(function(t){
      return '<button type="button" role="tab" class="tab" data-act="tab" data-v="' + t[0] + '" aria-selected="' + (S.tab === t[0]) + '">' + t[1] + '</button>'; }).join('') + '</div></nav><main class="pag" id="pag"></main>';
  pintarPag();
}
function pintarCarga(){
  app.innerHTML = '<header class="cab"><div class="cab-in">' + MARCA + '</div></header>' +
    '<div class="carga" role="status"><b>Cargando ventas…</b><div class="tira"><i style="width:' + Math.max(6, S.progreso[0] / S.progreso[1] * 100) + '%"></i></div></div>';
}
function pintarError(){
  app.innerHTML = '<header class="cab"><div class="cab-in">' + MARCA + '</div></header>' +
    '<main class="pag"><div class="aviso err"><b>No se han podido cargar las ventas.</b><br>' + esc(S.error) + '</div><button type="button" class="btn" data-act="reintentar">Reintentar</button></main>';
}
function scrollArriba(){ window.scrollTo(0, 0); }
/* La pestaña Servicio puede llegar hasta el último día con servicio aunque aún no haya ventas de ese día: usa un modelo con esas fechas añadidas (S.mS). El resto de pestañas usan solo los días con ventas (S.mV). */
function modeloServicio(mV, sv){
  var set = {}; mV.fechas.forEach(function(f){ set[f] = 1; });
  sv.fechas.forEach(function(f){ var d = sv.dias[f]; if (d && d.t > 0) set[f] = 1; });
  return Object.assign({}, mV, { fechas: Object.keys(set).sort() });
}
function entrarServicio(){
  if (!S.mS) return;
  var uV = T.ultimaFecha(S.mV), uS = T.ultimaFecha(S.mS); S.m = S.mS;
  if (uV && uS && uS > uV){
    if (S.anchor === uV) S.anchor = uS;
    if (S.rango && S.rango.hasta === uV){ var len = T.isoNum(S.rango.hasta) - T.isoNum(S.rango.desde); S.rango = { desde: T.sumarDias(uS, -len), hasta: uS }; }
  }
}
function salirServicio(){
  if (!S.mV) return;
  S.m = S.mV; var uV = T.ultimaFecha(S.mV), prim = T.primeraFecha(S.mV);
  if (!uV) return;
  if (S.anchor > uV) S.anchor = uV;
  if (S.rango && S.rango.hasta > uV){ var len = T.isoNum(S.rango.hasta) - T.isoNum(S.rango.desde), d = T.sumarDias(uV, -len); S.rango = { desde: d < prim ? prim : d, hasta: uV }; }
}
function irTab(v){
  if (v === 'servicio' && S.tab !== 'servicio') entrarServicio();
  else if (v !== 'servicio' && S.tab === 'servicio') salirServicio();
  S.tab = v;
}
function actuar(act, v, k){
  var antes = window.pageYOffset;
  switch (act){
    case 'tab': irTab(v); pintarPag(); scrollArriba(); return;
    case 'modo':
      if (v === 'dia') S.anchor = snapDia(S.anchor);
      S.modo = v; break;
    case 'nav': navegar(+v); break;
    case 'metrica': S.metrica = v; break;
    case 'lista': S.listaMovil = v; break;
    case 'evo-vent': S.evo.vent = v === 'todo' ? 'todo' : +v; S.evo.sel = null; S.evo.todos = false; break;
    case 'evo-met': S.evo.met = v; break;
    case 'evo-desg': S.evo.desg = v; break;
    case 'evo-todos': S.evo.todos = true; break;
    case 'evo-sel': S.evo.sel = +v; refrescarLecturaDia(); return;
    case 'srv-sel': S.srv.sel = +v; refrescarLecturaServicio(); return;
    case 'srv-todos': S.srv.todos = true; break;
    case 'ir-dia': irTab('resumen'); S.modo = 'dia'; S.anchor = v; pintarPag(); scrollArriba(); return;
    case 'ver-prov-evo': S.evo.desg = 'prov'; irTab('evolucion'); pintarPag(); scrollArriba(); return;
    case 'prod-cat': S.prod.cat = v; S.prod.sub = 'Todas'; break;
    case 'prod-sub': S.prod.sub = v; break;
    case 'prod-orden': S.prod.orden = v; break;
    case 'reintentar': iniciar(); return;
    case 'entrar': entrar(); return;
    case 'salir': limpiarSes(); S.m = null; S.mV = null; S.mS = null; S.tab = 'resumen'; S.sim = { vent: 90, q: '', items: [], perd: 10, hist: {}, dias: [true, true, true, true, true, true, true], ayuda: true }; pintarAcceso(); return;
    default: if (act.indexOf('sim-') === 0 && simAccion(act, v, k) !== false) break; return;
  }
  pintarPag(); window.scrollTo(0, antes);
}
function refrescarLecturaDia(){
  var m = S.m, e = S.evo, ult = T.ultimaFecha(m), prim = T.primeraFecha(m);
  var desde = e.vent === 'todo' ? prim : T.sumarDias(ult, -(e.vent - 1)); if (desde < prim) desde = prim;
  var serie = T.serieDiaria(m, desde, ult), segs = segmentos(serie);
  var l = document.getElementById('lect-dia'); if (l) l.innerHTML = lecturaDia(serie, segs, e.sel);
  Array.prototype.forEach.call(document.querySelectorAll('.col'), function(b, i){ b.setAttribute('aria-pressed', String(i === e.sel)); });
}
document.addEventListener('click', function(ev){
  var b = ev.target.closest ? ev.target.closest('[data-act]') : null;
  if (b && !b.disabled) actuar(b.dataset.act, b.dataset.v, b.dataset.k);
});
document.addEventListener('change', function(ev){
  var t = ev.target, f = t.dataset && t.dataset.f; if (!f) return;
  if (f.indexOf('sim-') === 0){ simCambio(t, f); return; }
  if (f === 'periodo'){ S.anchor = t.value; }
  else if (f === 'desde' || f === 'hasta'){
    var r = { desde: S.rango.desde, hasta: S.rango.hasta }; if (T.esIso(t.value)) r[f] = t.value; S.rango = r;
  } else return;
  var y = window.pageYOffset; pintarPag(); window.scrollTo(0, y);
});
document.addEventListener('input', function(ev){
  var t = ev.target;
  if (t.dataset && t.dataset.f === 'q'){ S.prod.q = t.value; repintarListaProductos(); }
  else if (t.dataset && t.dataset.f === 'sim-q'){ S.sim.q = t.value; var bz = document.getElementById('sim-busca'); if (bz) bz.innerHTML = simBuscadorSeguro(T.agregar(simModelo(), simVentana())); }
  else if (t.dataset && t.dataset.f === 'sim-perd'){ S.sim.perd = +t.value; simRepintarResultados(); }
});

var SES = 'trattoria_socio_v1';       // solo se guarda el permiso firmado; nunca la contraseña
function getSes(){ try { var s = JSON.parse(localStorage.getItem(SES) || 'null'); return s && s.token ? s : null; } catch (e){ return null; } }
function setSes(s){ try { localStorage.setItem(SES, JSON.stringify(s)); } catch (e){} }
function limpiarSes(){ try { localStorage.removeItem(SES); } catch (e){} }
function pintarAcceso(error){
  app.innerHTML = '<header class="cab"><div class="cab-in">' + MARCA + '<div class="cab-txt"><b>Ventas · panel de socios</b><small>Acceso con la contraseña de los socios</small></div></div></header>' +
    '<main class="pag"><section class="bloque acceso"><h2>Entra con la contraseña</h2><p class="sub-txt">Es la contraseña de los socios que te ha dado Jorge. Solo hay que escribirla una vez en cada dispositivo.</p>' +
    (error ? '<div class="aviso err" role="alert">' + esc(error) + '</div>' : '') + '<label for="cod">Contraseña</label>' +
    '<input class="campo" id="cod" type="password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" maxlength="64" placeholder="Contraseña">' +
    '<label class="chk" style="margin-top:10px"><input type="checkbox" id="ver-clave"><span>Mostrar la contraseña</span></label>' +
    '<p style="margin-top:14px"><button type="button" class="btn" data-act="entrar">Entrar</button></p></section></main>';
  var c = document.getElementById('cod'), ver = document.getElementById('ver-clave');
  if (ver) ver.addEventListener('change', function(){ c.type = ver.checked ? 'text' : 'password'; });
  if (c){ c.addEventListener('keydown', function(e){ if (e.key === 'Enter') entrar(); }); c.focus(); }
}
async function entrar(){
  var cod = ((document.getElementById('cod') || {}).value || '').trim();
  if (!cod) return pintarAcceso('Escribe la contraseña.');
  S.cargando = true; pintarCarga();
  try {
    var r = await API.accion('socio', { clave: cod });
    setSes({ nombre: r.nombre, token: r.token, exp: r.expira }); iniciar();
  } catch (e){ S.cargando = false; pintarAcceso(e.message); }
}
async function iniciar(){
  var ses = getSes();
  if (!ses) return pintarAcceso();
  S.cargando = true; S.error = null; pintarCarga();
  try {
    S.progreso = [1, 4]; pintarCarga();
    var d = await API.ventas(ses.token);
    S.m = T.crearModelo(d.shards, d.clasif); S.estado = d.estado || null; S.ses = ses;
    S.svInfo = null; S.sv = T.crearServicio(comensalesDe(S.m)); S.srv = { sel: null, todos: false, clave: '', serie: [] }; S.sim.hist = {};
    S.mV = S.m; S.mS = modeloServicio(S.mV, S.sv); if (S.tab === 'servicio') S.m = S.mS;
    var ult = T.ultimaFecha(S.m);
    S.anchor = ult;
    if (ult){ var prim = T.primeraFecha(S.m), ini = T.sumarDias(ult, -29); S.rango = { desde: ini < prim ? prim : ini, hasta: ult }; }
    else S.rango = { desde: '2000-01-01', hasta: '2000-01-01' };
    S.cargando = false; armarMarco();
  } catch (e){
    S.cargando = false;
    if (e && e.codigo === 'SESION'){ limpiarSes(); return pintarAcceso(e.message); }
    S.error = e && e.message ? e.message : String(e); pintarError();
  }
}
window.__viewer = { S: S, iniciar: iniciar, bonito: bonito };
iniciar();
})();
